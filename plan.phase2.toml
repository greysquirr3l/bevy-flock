    "Draw the anchor exemption explicitly: anchored NPCs in one colour, so the memory-reclamation behaviour is visible rather than argued.",
]
test_hints = [
    "The primitive budget is respected at 1M inhabitants, asserted by counting queued gizmos.",
    "Each layer toggles independently.",
    "With the feature off, no gizmo code compiles into the build.",
]
must_haves = [
    "A primitive budget with a documented default",
    "Anchored NPCs visibly distinguished",
    "No writes to simulation state",
]
evaluation_criteria = [
    "A capture of the debug draw is committed to the docs once the tree has settled",
    "Frame cost with all layers on is measured and stated",
    "A reviewer can see a band boundary move when the budget changes",
]

[[phases.tasks]]
slug      = "replay-scrubber"
title     = "Scrub the deterministic tick backwards and forwards"
goal     = "Record a run's command log and snapshots, scrub to any tick, and prove that the digest at a scrubbed tick equals a fresh run to that tick."
depends_on = ["inspector-overlay", "debug-draw"]
hints = [
    "Snapshot every N ticks (configurable), replay forward from the nearest snapshot to the target, and discard history beyond a budget; the count in a test must match an uninterrupted run exactly.",
    "The command log is the existing deterministic input surface, not a new one; if commands are not yet recorded, that recording is part of this task.",
    "Expose it as a CLI in the tooling crate and as a keyboard control in the example, so both a test and a human can drive it.",
]
test_hints = [
    "Scrub to tick 200 and back to 500 in a 500-tick run: the digest equals the uninterrupted run's.",
    "Scrubbing across a band transition produces the same manifested set as the fresh run.",
    "A corrupted snapshot is rejected with a typed error and leaves the run intact.",
]
must_haves = [
    "Digest parity is a test, not a claim",
    "History memory is bounded and configurable",
    "A corrupt snapshot cannot panic the scrubber",
]
evaluation_criteria = [
    "The parity test covers a run with band transitions, memory and gestures",
    "Memory ceiling is stated for a 10,000-body run at the default interval",
    "The CLI reproduces the test's result on the shipped example",
]

[[phases.tasks]]
slug      = "census-hud"
title     = "The numbers a reviewer wants, on screen and in one command"
goal     = "A HUD and a `--census` output reporting population by tier, thinking count against budget, allocation count, per-leaf cost drift and the spatial occupancy summary."
depends_on = ["inspector-overlay"]
hints = [
