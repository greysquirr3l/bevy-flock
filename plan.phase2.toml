# ─── Phase 5: reference adapters ────────────────────────────────────────────

[[phases]]
name  = "Reference Adapters"
order = 5
description = "One working implementation per port, plus the conformance suite that makes a game's own adapter checkable."

[[phases.tasks]]
slug      = "adapter-conformance-kit"
title     = "A conformance suite every adapter must pass"
goal     = "A shared test kit that takes any implementation of the physics, navigation and replication ports and proves it honours the contract, so reference adapters and a game's own are checked the same way."
depends_on = ["skinned-district-example"]
hints = [
    "The kit lives in a dev-only crate so a game can depend on it without pulling adapters in; it exposes functions a game's test calls, not a macro that hides the assertions.",
    "Cover the contract, not the implementation: ordering, determinism of what the port returns, handling of an NPC that despawns mid-frame, and behaviour when the port is unavailable.",
    "Every reference adapter in this phase runs the kit; a documented skip is allowed only where the port's contract genuinely permits it.",
]
test_hints = [
    "A deliberately broken adapter fails the kit with a message naming the violated clause.",
    "The kit runs with no window, no GPU and no network.",
]
must_haves = [
    "Kit is reusable outside this repository",
    "Each clause it checks maps to a sentence in the port's documentation",
    "A skip must state its reason in the adapter's own docs",
]
evaluation_criteria = [
    "Each port's documentation gained a sentence per conformance clause",
    "The kit is proven to catch a broken adapter",
    "No adapter is exempt without a documented reason",
]

[[phases.tasks]]
slug      = "adapter-avian"
title     = "Avian as the reference physics adapter"
goal     = "Push steering velocities into Avian's kinematic character controller, read positions back, and prove the handoff resolves a collision without breaking determinism."
depends_on = ["adapter-conformance-kit", "animation-transition-quality"]
hints = [
    "Its own crate behind `physics-avian`; the core keeps its zero-physics dependency graph.",
    "Avian's character controller is kinematic: the simulation owns intent, the controller owns resolution, and the next tick's steering reads the resolved position. Document that split because it is the thing every game gets wrong.",
    "Determinism: physics resolution is not deterministic across Avian versions, so state the guarantee precisely — a replay with physics enabled is reproducible only for a pinned Avian version, and say so in the adapter's docs.",
]
test_hints = [
    "An NPC steered into a wall ends up outside it, and the following tick's steering sees the corrected position.",
    "The conformance kit passes.",
    "With the feature off, the core's dependency graph is unchanged.",
]
must_haves = [
    "Adapter crate behind its own feature, with the conformance kit as a test dependency",
    "The determinism caveat is documented in the adapter, not buried",
    "2,000-body cost measured and recorded",
]
evaluation_criteria = [
    "The collision test fails if position readback is removed",
    "The core's `cargo tree` is unchanged",
    "The adapter's docs state what it does not do (e.g. ragdolls, stacking)",
]

[[phases.tasks]]
slug      = "adapter-navmesh-bake"
title     = "Bake a navmesh from level geometry into the existing navmesh feature"
goal     = "Produce the `navmesh` feature's polygon mesh from a Bevy scene's colliders, with area costs and off-mesh links, so a level with doorways works without a hand-authored grid."
depends_on = ["adapter-conformance-kit"]
hints = [
    "Bake offline in a tool or at load in a development build; the shipped path reads a baked artifact, because a bake in the frame budget is a stall.",
    "Reuse the existing navmesh adjacency and string-pulled routing; the new work is geometry to polygons, not a second pathfinder.",
    "Off-mesh links (doors, ladders, jumps) are authored data that survive a re-bake, keyed by position so a geometry change does not silently drop them.",
]
test_hints = [
    "A two-room scene with one doorway produces a route that goes through the doorway rather than around the building.",
    "A re-bake preserves authored off-mesh links within tolerance.",
    "Pathing on the baked mesh matches the grid's result on an open plane, within a stated tolerance.",
]
must_haves = [
    "Bake runs offline and is reproducible for the same input",
    "Off-mesh links survive a re-bake",
    "The `navmesh` feature's existing tests still pass",
]
evaluation_criteria = [
    "The doorway test fails without the bake and passes with it",
    "Bake time is stated for a representative scene",
    "No new dependency in the core crate",
]

[[phases.tasks]]
slug      = "adapter-replicon"
title     = "Replication that respects the tier budget"
goal     = "Feed the existing quantised tier deltas into bevy_replicon so a client sees the near tier in full and the ambient tier as aggregate deltas, under a documented byte ceiling."
depends_on = ["adapter-conformance-kit"]
hints = [
    "The quantisation and delta format already exist in `src/adapters/secondary/network.rs`; this adapter is transport and interest management, not a second encoding.",
    "Interest is the player's tier, not a radius recomputed independently, so the bytes follow the scheduler's decision.",
    "Measure bytes per tick at 10,000 bodies and paste the number; the ceiling is part of the acceptance.",
]
test_hints = [
    "Near-tier NPCs arrive with position, facing and tier; ambient bodies arrive as aggregate counts.",
    "Bytes per tick at 10,000 bodies stay under the documented ceiling.",
    "A despawn on the server does not leave a ghost on the client after the reconciliation window.",
]
must_haves = [
    "No second encoding of the same state",
    "Byte ceiling documented and measured",
    "Core's dependency graph unchanged",
]
evaluation_criteria = [
    "The measured bytes per tick are in the notes and in `docs/performance.md`",
    "A test proves interest management follows the tier, not a duplicate radius",
    "The adapter documents its interpolation assumptions",
]

[[phases.tasks]]
slug      = "adapter-render-lod"
title     = "Promote the impostor budget out of the demo and into the library"
goal     = "Move the demo's LOD switching — mesh to billboard with a cross-fade band, driven by a per-frame budget — into the library's render adapter, so a game gets it without copying demo code."
depends_on = ["adapter-conformance-kit", "animation-culling-and-lod"]
hints = [
    "The demo has this logic already (`demo-gpu/src/session.rs` and the render plan in `src/adapters/primary/render.rs`); promote the decision logic, leave the GPU code in the demo.",
    "The budget decides how many bodies get a mesh; the cross-fade band is a function of distance, evaluated in the render plan rather than in a shader, so it is testable without a device.",
    "The animation culling from phase 2 must feed the same budget, or an NPC will be animated while drawn as a billboard.",
]
test_hints = [
    "Budget accounting: the plan never allocates more mesh slots than the configured budget.",
    "A body crossing the fade band produces monotonic billboard opacity across ticks.",
    "The animated-but-invisible case is impossible: any body with a mesh is animated, any billboard is not.",
]
must_haves = [
    "Decision logic in the library, GPU code stays in the demo",
    "Fade is tick-driven and testable without a device",
    "The demo now consumes the library's plan rather than its own copy",
]
evaluation_criteria = [
    "The demo's duplicated logic is removed, proven by the demo building against the library API",
    "Mesh/billboard animation consistency is asserted by a test",
    "Per-frame plan cost measured at 10,000 bodies",
]

# ─── Phase 6: persistence and streaming ─────────────────────────────────────

[[phases]]
name  = "World Persistence"
order = 6
description = "Leave the city, come back, and find the same people with the same grudges."

[[phases.tasks]]
slug      = "crowd-snapshot"
title     = "Snapshot the crowd, not just the memories"
goal     = "A versioned snapshot of a running crowd — identities, transforms, velocities, brain state, memory rows, registry hash — that restores into a fresh app with a matching digest."
depends_on = ["archetype-registry", "adapter-conformance-kit"]
hints = [
    "Extend the existing save format rather than inventing a second one; `src/domain/saves.rs` already has the versioning idiom and a compatibility corpus.",
    "Snapshots are cold: taking one is allowed to allocate, restoring must not depend on tick history.",
    "Record the content hash from the registry, so restoring a snapshot against edited content fails loudly instead of silently changing the world.",
]
test_hints = [
    "Save at tick 400, restore, advance 50: digests match an uninterrupted run.",
    "Restoring against a different registry hash fails with a typed error naming both hashes.",
    "A snapshot with a truncated section is rejected without panicking.",
]
must_haves = [
    "One versioning idiom across memory and crowd snapshots",
    "Content hash recorded and checked",
    "Restore into a fresh app is the tested path, not restore in place",
]
evaluation_criteria = [
    "Digest parity after restore is a test",
    "Snapshot size is measured for 10,000 bodies and stated",
    "The format is documented field by field",
]

[[phases.tasks]]
slug      = "region-streaming"
title     = "Stream the crowd around a moving anchor, keeping identity"
goal     = "Spawn and dissolve population around a moving anchor without breaking identity: an NPC that leaves and returns is the same NPC, and anchored NPCs are never dissolved."
depends_on = ["crowd-snapshot"]
hints = [
    "The band system already materialises and dissolves; the new work is identity continuity — the frozen record of an NPC that left must survive and be restored on return, with its memory.",
    "Anchor exemption is a hard rule from ADR 0019/0020: assert it in a long test with a travelling anchor and an anchored NPC.",
    "Population mass must stay conserved across the boundary, which the existing boundary harness already checks; extend it rather than writing a parallel test.",
]
test_hints = [
    "A 10,000-body city, an anchor travelling 2 km and back: live count returns to 10,000 and every returning NPC keeps identity and memory.",
    "An anchored NPC survives 10,000 ticks of travel.",
    "No allocation growth across 10,000 ticks of streaming, asserted with the counting allocator.",
]
must_haves = [
    "Identity continuity proven by a test, not by construction",
    "Anchor exemption asserted in the long test",
    "Memory growth bounded and measured",
]
evaluation_criteria = [
    "The returning-NPC test fails if the frozen record is dropped",
    "Allocation count is flat across the travel test",
    "The boundary harness from phase 1 is extended, not duplicated",
]

[[phases.tasks]]
slug      = "save-compat-matrix"
title     = "Extend the compatibility corpus to crowd snapshots"
goal     = "Backward and forward compatibility tests for the crowd snapshot, in the same shape the memory corpus already uses."
depends_on = ["crowd-snapshot"]
hints = [
    "The corpus is committed files generated by the writer, one per supported version; a test loads each and compares a digest.",
    "Forward incompatibility is a test too: a file from the next minor version must fail with a version error, not a parse error.",
    "Regenerating the corpus is a scripted step with a documented command, so it does not rot.",
]
test_hints = [
    "Every committed corpus file loads and produces its recorded digest.",
    "A synthetic future-version file fails with the typed version error.",
    "A file missing an optional section loads with documented defaults.",
]
must_haves = [
    "Corpus files committed, one per supported version",
    "Regeneration command documented and scripted",
    "Forward failure is tested, not assumed",
]
evaluation_criteria = [
    "The corpus runs in CI on every platform in the matrix",
    "Digests are compared, not field counts",
    "A reviewer can add a version by following the documented step",
]

# ─── Phase 7: the determinism contract ──────────────────────────────────────

[[phases]]
name  = "Determinism Contract"
order = 7
description = "The claim in the README becomes a claim the tests prove, scoped to where it is true."

[[phases.tasks]]
slug      = "determinism-adr"
title     = "Decide what determinism means, and write it down"
goal     = "An ADR that states the guarantee precisely — same build, same target, same feature set, same seed — names what is not guaranteed, and sets the rule for threading and for adapters that break it."
depends_on = ["adapter-avian", "region-streaming"]
hints = [
    "The honest boundary: `f32` maths plus a system libm plus different backends means cross-architecture bit-identity is not achievable, and the ADR should say so rather than implying otherwise.",
    "Cover the three cases explicitly: replay on the same target (guaranteed), across targets with the same libm and toolchain (best effort, tested where CI can), and across architectures (not guaranteed).",
    "State the threading rule as a testable sentence, and point at the test that proves worker-count invariance.",
    "If a fixed-point path is wanted, it is a separate ADR with its own budget; this one records the decision not to take it yet and why.",
]
test_hints = [
    "Every claim in the ADR maps to a named test or CI job, listed in a table at the end.",
    "A claim with no test is either removed or marked as untested in the ADR.",
]
must_haves = [
    "One paragraph a game developer can act on",
    "A table mapping each claim to the test that proves it",
    "Adapters that break the guarantee are named",
]
evaluation_criteria = [
    "No claim in the ADR lacks a test or an explicit untested marker",
    "The README's determinism sentence will match the ADR's scope after the docs task",
    "The threading rule is a sentence that can be falsified",
]

[[phases.tasks]]
slug      = "determinism-probe"
title     = "A probe that measures the guarantee instead of asserting it"
goal     = "A runnable probe that replays a recorded command log, compares checkpoint digests, and reports divergence with the first differing field — used in CI where the guarantee is claimed and as information elsewhere."
depends_on = ["determinism-adr"]
hints = [
    "Record: seed, feature set, tick count, command log. Verify: replay and compare digests at checkpoints. Both one command.",
    "Digest comparison must name the first divergent entity and field, or the probe is useless for debugging.",
    "Run it in CI on the targets where the guarantee is claimed, and as a non-blocking report on the ones where it is not.",
]
test_hints = [
    "A deliberately perturbed run fails the probe with the first divergence named.",
    "Same-target replay exits zero on every claimed target.",
    "Worker-count invariance passes with 1 and with all cores.",
]
must_haves = [
    "One command records, one verifies",
    "The first divergent field is reported",
    "CI runs it where claimed and reports it where not",
]
evaluation_criteria = [
    "The probe runs in the release checklist",
    "A reviewer can reproduce a reported divergence from the recorded log",
    "The probe is used by at least one example, proving it works outside the test harness",
]

[[phases.tasks]]
slug      = "determinism-docs"
title     = "Say the same thing in the README, the book and the site"
goal     = "Rewrite every determinism claim in the repository to the scope the ADR defines, and add the replay workflow to the book so a game can adopt it in an afternoon."
depends_on = ["determinism-probe"]
hints = [
    "Search for every occurrence of 'deterministic', 'bit-identical', 'replay' and 'same on every platform' in README, book, docs and crate docs, and reconcile each with the ADR.",
    "Add a book chapter: recording a run, verifying it, and what to do when the probe reports divergence.",
    "Corrections are part of the task, not a follow-up: a claim that survives the ADR but not the code is a lie with a citation.",
]
test_hints = [
    "A grep-based test or CI step lists every claim site and fails if one contains a phrase the ADR retired.",
    "Book code blocks compile or are marked text.",
]
must_haves = [
    "No claim in the repository exceeds the ADR's scope",
    "Replay workflow documented end to end",
    "The grep check is in CI so the claims cannot drift again",
]
evaluation_criteria = [
    "Every claim site reconciled, with the list in the task notes",
    "The book chapter lets a reader record and verify a run",
    "CI enforces the retired phrases",
]

# ─── Phase 8: 1.0 ───────────────────────────────────────────────────────────

[[phases]]
name  = "Ship 1.0"
order = 8
description = "The boring work that makes the interesting work adoptable: stability policy, gates, docs site, examples, migration, publish."

[[phases.tasks]]
slug      = "api-stability-policy"
title     = "Semver, MSRV and the API snapshot"
goal     = "A written stability policy, a cargo-semver-checks gate on the public API, and an MSRV that CI actually holds."
depends_on = ["determinism-docs"]
hints = [
    "Policy: which crates are 1.0, which are 0.x, what a minor bump may change, and how deprecations work for at least one minor version.",
    "cargo-semver-checks against the last published version runs in CI; a break must be deliberate and recorded in the changelog.",
    "MSRV pinned in one place and checked by a dedicated CI job, not by a comment in the README.",
]
test_hints = [
    "The semver job fails on a synthetic breaking change.",
    "The MSRV job builds with the pinned toolchain.",
    "The API snapshot diff appears in the pull request body via the existing tooling or a committed file.",
]
must_haves = [
    "Policy document under `docs/`",
    "Semver and MSRV gates in CI",
    "A deprecation example in the codebase",
]
evaluation_criteria = [
    "A reviewer can tell what a version bump permits without reading code",
    "The gates fail when they should, proven by a synthetic change",
    "MSRV is one number in one place",
]

[[phases.tasks]]
slug      = "perf-gates"
title     = "Performance gates that fail a pull request"
goal     = "Turn the measured budgets into CI gates — crowd kernel, animation binding, readback, band transition — with thresholds derived from committed baselines and a documented way to update them."
depends_on = ["api-stability-policy", "animation-perf-budget"]
hints = [
    "Reuse the existing scaling-regression suite and its baseline format rather than adding a second mechanism.",
    "Thresholds are per-machine-class where possible; where they cannot be, the gate compares against a committed baseline on the fixed runner and fails on a percentage regression.",
    "Updating a baseline is a scripted, reviewable commit, not a hand edit.",
]
test_hints = [
    "A deliberately slowed kernel fails the gate with the offending benchmark named.",
    "The gate passes on an unchanged tree.",
]
must_haves = [
    "Every published budget has a gate or a documented reason it cannot be gated",
    "Baseline updates are scripted and reviewed",
    "The gates run on the same runner class as the baselines",
]
evaluation_criteria = [
    "A regression is caught before merge, demonstrated once",
    "The gate names the benchmark and the delta",
    "No budget in the docs is ungated without a reason",
]

[[phases.tasks]]
slug      = "docs-site"
title     = "Publish the documentation as a Starlight site"
goal     = "An Astro/Starlight site generated from `docs/`, with the book, the ADRs, the performance record and the playbooks navigable, deployed to GitHub Pages by a script the user can run where the pages clone lives."
depends_on = ["determinism-docs"]
hints = [
    "Blocked until the documentation cleanup lands: start from the settled `docs/` tree, not the one being restructured, or the mapping is written twice.",
    "`docs/` stays canonical. A sync step generates Starlight content with frontmatter and rewritten links at build time, and the generated tree is gitignored, so there is one copy of the prose.",
    "Follow the skill's deploy script contract: configuration in `package.json`, a `deploy:dry` rehearsal, and the Pages-source conflict documented rather than worked around.",
    "The site must build in CI as a check even though deploy runs from the user's machine.",
]
test_hints = [
    "A CI job builds the site and fails on a broken internal link.",
    "The sync step is deterministic: two runs produce identical output.",
    "Every ADR, chapter and playbook appears in the navigation, asserted by a test that counts sources against pages.",
]
must_haves = [
    "One source of truth for the prose",
    "CI builds the site",
    "Deploy is a documented command, not a manual sequence",
]
evaluation_criteria = [
    "A page exists for every source document, proven by a count",
    "The link check covers relative links and images",
    "The deploy rehearsal runs without touching the live site",
]

[[phases.tasks]]
slug      = "example-catalogue"
title     = "Examples a developer can run in five minutes"
goal     = "A small, CI-smoke-tested set: headless crowd, skinned district, authored content, inspector, streaming city — each runnable with one command and each proving one capability end to end."
depends_on = ["perf-gates", "region-streaming", "inspector-overlay"]
hints = [
    "Every example has a `--frames N --headless` path so CI runs it without a display; the animated ones assert a weight or a census value before exiting.",
    "Keep the set small and orthogonal; a tenth example that differs by a flag is a maintenance cost, not a feature.",
    "The catalogue is the README's front door: each entry says what it proves and what to read next.",
]
test_hints = [
    "CI runs every example in headless mode and fails on a non-zero exit.",
    "Each example's assertion would fail if its capability were stubbed.",
]
must_haves = [
    "Five examples, each with a headless path",
    "CI smoke-tests all of them",
    "README links each with what it proves",
]
evaluation_criteria = [
    "A developer can go from clone to a running crowd in one command",
    "No example requires an asset download",
    "The examples between them exercise animation, authoring, tooling, streaming and the core",
]

[[phases.tasks]]
slug      = "migration-guide"
title     = "A migration guide from 0.1 to 1.0"
goal     = "A guide that takes a 0.1 user to 1.0: renamed APIs, the new features and what they cost, the determinism scope, and the order to adopt them in."
depends_on = ["example-catalogue"]
hints = [
    "Written against real code: port one of the phase-1 demos through the guide as a worked example, and commit the before/after.",
    "Call out the breaking changes with the compiler error a user will actually see, so the guide is greppable.",
    "State plainly which new features are opt-in and what each one costs in dependencies and frame time.",
]
test_hints = [
    "The worked port compiles and its tests pass in CI.",
    "Every breaking change listed has a compiler error quoted next to it.",
]
must_haves = [
    "A worked port, not only prose",
    "Costs stated per opt-in feature",
    "Determinism scope explained in the guide's first screen",
]
evaluation_criteria = [
