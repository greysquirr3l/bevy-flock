    "Cost drift is flagged when a leaf is deliberately slowed by 25% in a test.",
    "The HUD and the headless output agree for the same tick.",
]
must_haves = [
    "One command produces the table with no window",
    "Population counts sum to the configured population in every test",
    "Drift uses the existing calibration tolerance, not a second number",
