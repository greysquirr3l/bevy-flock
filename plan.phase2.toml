# ─── Policy ──────────────────────────────────────────────────────────────────

[security]
# No network, storage or authentication surface in the library. The replication
# adapter is transport-shaped but delegates to a game's bevy_replicon setup; the
# supply-chain job (cargo-deny/audit) and the fuzz targets cover the rest.
skip_hardening_task = true

[integration]
skip_wiring_audit = false
skip_stub_audit   = false

[targets]
vscode      = true
claude      = true
agent_rules = true
opencode    = false

[style]
avoid_ai_patterns = true
avoid_god_files   = true
strict            = true
completion_standard = """
Every task ships only when all of the following hold, and the evidence is in the
completion notes rather than in a claim:

- Preflight (build + test + lint + deny) passes with zero warnings, on the default
  feature set, on --all-features and on --no-default-features.
- Every exit criterion in the task file is met. A partially met criterion is a
  failed task, and an inconvenient criterion is the one that mattered.
- The task's benchmark exists and was actually run. Numbers are pasted, not
  estimated, and the machine is named. A budget with no number is not a budget.
- Nothing in the animation or tooling paths reads frame delta time. The two-frame-rate
  replay test exists and covers the new work, not only the work it was written for.
- No placeholder survives: no todo!(), no unimplemented!(), no hard-coded return
  standing in for an implementation, no "for now" branch.
- No #[allow] was added. No unwrap/expect/panic entered library code. No unsafe
  entered the crate. A silenced lint has a reason and an entry in the audit script.
- The core crate's dependency graph is unchanged, and the change is proven by the
  CI step that diffs `cargo tree -p bevy-flock -e normal`, not by inspection.
- New public API has a compiled doctest, and a game can adopt it from the doc
  comment and the example alone.
- Documentation states the contract and what breaks if it changes; the ADR and the
  book chapter are updated in the same task as the code.
- `demo`, `demo-gpu` and `playground` still build and their tests still pass.
- Tests fail if the implementation is reverted to a stub. Verified by commenting
  out the implementation and watching the test go red.
- The work is finished, not deferred. "Follow-up task" is only acceptable for
  genuinely new scope the plan did not name, never for finishing this one.
"""
