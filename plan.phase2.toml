[[phases.tasks]]
slug      = "release-1-0"
title     = "Publish 1.0 and prove the artefacts"
goal     = "Cut the release: changelog, release checklist executed, docs.rs build verified, crates published in dependency order, and a tag whose tree reproduces the released artefacts."
depends_on = ["migration-guide"]
hints = [
    "Execute the existing `docs/release-checklist.md`, updating it where phase 2 changed the process.",
