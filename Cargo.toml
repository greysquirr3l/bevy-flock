[workspace]
# Phase 2 gives the integrations their own crates so the simulation core keeps its dependency set:
# the animation layer needs bevy_animation, which no headless server build should compile. Members
# are `crates/*` and nothing else.
#
# The demo crates are excluded on purpose. Each is its own package with its own lock file, its own
# release profile and its own reason to exist, and folding them in would make a `cargo test` at the
# root build three renderers before it ran a single simulation test.
members = ["crates/*"]
exclude = ["demo", "demo-gpu", "playground", "compat", "fuzz"]

[package]
name = "bevy-flock"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Nick <greysquirr3l@users.noreply.github.com>"]
description = "Deterministic crowd and NPC simulation for Bevy: boids, budgeted level-of-detail cognition, pluggable behaviour, and a continuum ambient tier that scales past a million inhabitants."
repository = "https://github.com/greysquirr3l/bevy-flock"
homepage = "https://github.com/greysquirr3l/bevy-flock"
documentation = "https://docs.rs/bevy-flock"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bevy", "crowd", "npc", "simulation", "gamedev"]
categories = ["game-development", "simulation"]
# Benches and examples ship with the package: a reader can run what the README
# claims without cloning, and excluding them made `cargo package` warn about every
# `[[bench]]` target on every publish. `docs/` and CI stay out.
# The published crate ships code and the README. Everything a maintainer reads while tuning -- the ADRs, the
# performance journals, the gates, the playbooks, the benchmark harnesses, the docs site sources -- stays in the
# repository and out of the tarball, because crates.io is a distribution channel and not a filing cabinet.
exclude = [
    "docs/",
    ".github/",
    "site/",
    "benchmarks/",
    "crates/",
    "scripts/",
    "demo/",
    "demo-gpu/",
    "playground/",
    "compat/",
    "fuzz/",
    "assets/",
]
# The published crate ships code and docs only. Benchmarks and examples live in
# the repository so that dev-only dependencies never reach a consumer's graph.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The transposed crowd kernel (ADR 0030) is on by default: at 100,000 agents it is 19-31% off a steering
# pass at every cell size measured (ADR 0031), and a stride scheduler only pays for the frames it can
# afford, so a default build should not leave that on the table. `default-features = false` gives the
# simulation alone: no engine, no `bevy_ecs`, nothing this facade re-exports from an adapter crate.
default = ["simd", "threads", "ecs"]
# The Bevy integration: `bevy-flock-ecs` carries the plugin, components and systems, and this feature is the
# dependency edge to it. Off with `--no-default-features`, which is what makes the published facade usable
# as a headless simulation library with `bevy_flock::domain` and nothing else in the graph (ADR 0058, ADR 0062).
ecs = ["dep:bevy-flock-ecs"]
# Social memory: an opt-in store so a game that never remembers anyone does not pay for the rows.
memory = ["bevy-flock-core/memory", "bevy-flock-ecs?/memory"]
# Serialisation of blueprints, snapshots and authored behaviour trees.
serde = ["bevy-flock-core/serde", "bevy-flock-ecs?/serde"]
# A polygon navmesh with derived adjacency, area costs and a string-pulled route.
navmesh = ["bevy-flock-core/navmesh", "bevy-flock-ecs?/navmesh"]
# Steering on the ECS task pool (ADR 0044).
threads = ["bevy-flock-core/threads", "bevy-flock-ecs?/threads"]
# Four agents at a time through `wide::f32x4` (ADR 0023, ADR 0030).
simd = ["bevy-flock-core/simd", "bevy-flock-ecs?/simd"]
# The animation layer, which is `bevy-flock-anim`: blended clip weights from simulated locomotion, gaze and
# gesture playback. Off by default because it is the only part of the graph that pulls `bevy_animation` and
# `bevy_asset`. It needs `ecs`, because the layer reads components that only exist there.
anim = ["dep:bevy-flock-anim", "ecs"]
# Everything, for a game that wants the whole engine and would rather not read a feature table to find out
# which seven switches that is.
full = ["ecs", "simd", "threads", "memory", "serde", "navmesh", "anim"]

[dependencies]
# The simulation, with no engine in its graph. Everything the facade re-exports as `domain`, `behavior` and
# `application` is there, moved rather than copied, so a headless server can depend on the core alone.
bevy-flock-core = { version = "0.1.0", path = "crates/bevy-flock-core", default-features = false }
# The Bevy half: the plugin, the components and the systems. It owns every `bevy_ecs` import in the workspace,
# and the facade re-exports it at the paths a game already uses (`bevy_flock::adapters::primary::…`).
bevy-flock-ecs = { version = "0.1.0", path = "crates/bevy-flock-ecs", default-features = false, optional = true }
# The animation layer, which depends on the ECS half rather than on this crate. That direction is what lets a
# facade feature offer it at all (ADR 0061, ADR 0062).
bevy-flock-anim = { version = "0.1.0", path = "crates/bevy-flock-anim", optional = true }

[dev-dependencies]
# This crate's own tests, examples and benches drive the real plugin, so they name the engine crates the ECS half
# uses. Dev-dependencies on purpose: none of them reach a consumer's graph.
bevy_app = "0.20.1"
bevy_ecs = "0.20.1"
bevy_math = "0.20.1"
bevy_transform = "0.20.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
# The examples reach for these directly: `libm` for the platform-independent trigonometry the simulation
# itself uses, `bevy_tasks` to show what a frame of steering costs when it claims the pool.
libm = "0.2"
smallvec = "1.16"
bevy_tasks = { version = "0.20.1", default-features = false }

