# `memory_bridge` drives the ECS half of social memory: it imports `domain::memory` and
# `adapters::primary::memory_bridge`, both of which are compiled out without the feature. Without
# this line `cargo check --no-default-features --all-targets` fails on the test rather than on the
# library, which is how it sat broken on main.
[[test]]
name = "memory_bridge"
required-features = ["ecs", "memory"]

# `fuzz_decoders` is `#![cfg(feature = "memory")]`d to nothing without the feature. Declaring it
# here rather than relying on that keeps the manifest honest: a target that compiles to an empty
# binary and reports success is a test that has stopped testing.
[[test]]
name = "fuzz_decoders"
required-features = ["memory"]

