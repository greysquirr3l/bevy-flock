[[bench]]
name = "continuum"
harness = false

[[bench]]
name = "packed"
harness = false

[[test]]
name = "memory_aging"
required-features = ["memory"]

[[bench]]
name = "band"
harness = false

[[bench]]
name = "cognition"
harness = false

[[bench]]
