# The engine-facing half of the facade. `bevy_flock::adapters` and `bevy_flock::boids` are re-exports
# of `bevy-flock-ecs`, and the prelude's engine items come from the same crate, so a target that
# names any of them needs the `ecs` feature. Without the declarations below, `--no-default-features`
# fails on the *target* rather than on the library: the target is compiled in a configuration where
# the paths it imports do not exist. Declaring them means the target is skipped instead, which is
# what "the engine half is optional" has to mean for a target rather than only for a library.
