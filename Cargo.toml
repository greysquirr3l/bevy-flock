[package]
name = "bevy-flock"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Nick <greysquirr3l@users.noreply.github.com>"]
description = "Deterministic crowd and NPC simulation for Bevy: boids, budgeted level-of-detail cognition, pluggable behaviour, and a continuum ambient tier that scales past a million inhabitants."
repository = "https://github.com/greysquirr3l/bevy-flock"
homepage = "https://github.com/greysquirr3l/bevy-flock"
documentation = "https://docs.rs/bevy-flock"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bevy", "crowd", "npc", "simulation", "gamedev"]
categories = ["game-development", "simulation"]
# Benches and examples ship with the package: a reader can run what the README
# claims without cloning, and excluding them made `cargo package` warn about every
# `[[bench]]` target on every publish. `docs/` and CI stay out.
exclude = ["docs/", ".github/"]
# The published crate ships code and docs only. Benchmarks and examples live in
# the repository so that dev-only dependencies never reach a consumer's graph.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The transposed crowd kernel (ADR 0030) is on by default: at 100,000 agents it is 19-31% off a
# steering pass at every cell size measured (ADR 0031), and a stride scheduler only pays for the
# frames it can afford, so a default build should not leave that on the table. Turn it off if the
# per-frame structure-of-arrays copy does not suit your density: `default-features = false`.
default = ["simd", "threads"]
# Social memory: an opt-in store so a game that never remembers anyone does not
# pay for the rows. Off by default and dependency-free.
memory = []

# Serialisation of NPC blueprints, simulation snapshots and authored behaviour
# trees. Off by default: a server that only simulates should not pay for serde.
serde = ["dep:serde", "dep:ron", "smallvec/serde"]
# A polygon navmesh with derived adjacency, area costs and a string-pulled route: the shape a
# level with doorways actually needs, where a cell grid has to over-block or let agents clip the
# frame. Off by default because a game whose levels are open ground does not need it, and it is
# the largest single module in the domain.
navmesh = []
# Steering on the ECS task pool (ADR 0044): the frame is cut into slices, one per worker.
# On by default because it is the only lever that scales with cores rather than with lanes;
# `default-features = false` gives a single-threaded, dependency-light build for a
# deterministic replay harness or a single-core runner.
threads = ["bevy_tasks/multi_threaded"]
# Four agents at a time through `wide::f32x4`: the band kernel's blocks (ADR 0023) and the crowd
# kernel's transposed blocks (ADR 0030). On by default since ADR 0031 measured it winning at every
# density and population tested; the only cost is the `wide` dependency.
simd = ["dep:wide"]

[dependencies]
# Bevy 0.20 splits the engine finely enough that the simulation core needs only
# these five crates. `bevy_transform` is the ECS transform graph (also used by
# physics), not a rendering crate: no GPU, window or asset type reaches this
# crate through it. `bevy_tasks` is the task pool the ECS scheduler already uses;
# naming it directly is what lets one frame of steering claim the other cores
# (ADR 0044), and it adds nothing to the dependency graph that was not there.
bevy_app = "0.20.1"
bevy_ecs = "0.20.1"
bevy_math = "0.20.1"
bevy_tasks = { version = "0.20.1", default-features = false }
bevy_transform = "0.20.1"

smallvec = "1.16"
thiserror = "2.0"
# Transcendental functions come from libm, not std, because std's sin/cos/atan2
# delegate to the platform libm and differ in the last bits between operating
# systems. Determinism across platforms is a documented guarantee (ADR 0004).
libm = "0.2"
serde = { version = "1.0", features = ["derive"], optional = true }
# RON is how a designer authors a behaviour tree without recompiling. Optional for
# the same reason serde is: a headless server that builds trees in code should not
# carry a parser for a format it never reads.
ron = { version = "0.9", optional = true }
wide = { version = "1.7", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"

[[bench]]
name = "crowd"
harness = false

[[bench]]
name = "brain"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["memory"]
[[bench]]
name = "saves"
harness = false
required-features = ["memory"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
# `raw_borrows_via_references` belongs here and cannot be: creating a real reference and casting it
# away asserts aliasing the caller never promised, and `&raw const place` does not. The lint exists
# in rustc 1.99, and naming a lint the pinned 1.97 toolchain does not know turns every downstream
# build into an `unknown_lints` warning — which is why it is enabled by the probe-gated
# `lint-future` CI job instead, alongside the two clippy 1.99 lints.
# `rust_2018_idioms` is deliberately off: it flags every `Res<T>`, `Query<...>`
# and `Commands` in a Bevy system as a hidden lifetime, which is the framework's
# idiomatic spelling and not something this crate should paper over.
[lints.clippy]
# --- The spine -------------------------------------------------------------------------------
# Groups first, at the lowest priority, so individual lints below can move either way.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Allowed: opted out of, because they fight the domain vocabulary or duplicate documentation that
# is enforced elsewhere.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
# The steering kernels must not fuse. `a.mul_add(b, c)` rounds once where `a * b + c` rounds twice,
# and the SIMD road, the threaded road and the scalar reference are compared bit for bit; fusing one
# of them and not the others is a one-ulp divergence that the parity tests catch. Fusion is a
# measurement, not a default, so the lint that asks for it is off crate-wide.
suboptimal_flops = "allow"
# Denied: every one of these is a production incident waiting to happen, tests included. The code
# satisfies them by construction rather than by `#[allow]`: fallible constructors are `Result`,
# test fixtures use `testkit::OrDie` (which reports the failure with `unreachable!`, not `panic!`),
# and the kernels address slices through the index helpers in `application::crowd`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
# --- Documented deviations -------------------------------------------------------------------
# Each of these is a deliberate departure from the spine, kept in this one table rather than
# scattered through the tree as `#[allow]` attributes, and each with the reason it cannot be
# satisfied. `scripts/lint_audit.py` fails if one appears without an entry here.
#
# Bevy hands systems their parameters by value (`Res<T>`, `Query<..>`): the signature is the
# framework's, not an inefficiency to fix, and taking them by reference does not compile.
# The eight lints below were once allowed here with a paragraph of justification each. They are now
# denied, and the code satisfies them: the justifications were real, but "the simulation is numeric"
# is an argument for a documented `#[expect]` at the few sites where it is genuinely unavoidable,
# not for switching the lint off across 40 files.
needless_pass_by_value = "deny"
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
missing_const_for_fn = "deny"
significant_drop_tightening = "deny"
# Benchmarks run on the settings a game actually ships with: default release,
# no LTO. Flattering the numbers with `lto = "fat"` would measure a build nobody
# uses. Debug symbols stay on so a profile can be read against the source.
# Release-shaped, with symbols. `cargo flamegraph --profile profiling` then produces a
# flamegraph whose frames are readable rather than a wall of unresolved addresses.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.bench]
debug = true

[[test]]
name = "save_compat"
harness = true
required-features = ["memory"]

[[example]]
name = "registry_telemetry"
required-features = ["memory"]

[[example]]
name = "tavern_dialog"
required-features = ["serde"]

[[bench]]
name = "think"
harness = false

[[bench]]
name = "tiers"
harness = false

[[bench]]
name = "continuum"
harness = false

[[bench]]
name = "packed"
harness = false

[[test]]
name = "memory_aging"
required-features = ["memory"]

# `memory_bridge` drives the ECS half of social memory: it imports `domain::memory` and
# `adapters::primary::memory_bridge`, both of which are compiled out without the feature. Without
# this line `cargo check --no-default-features --all-targets` fails on the test rather than on the
# library, which is how it sat broken on main.
[[test]]
name = "memory_bridge"
required-features = ["memory"]

# `fuzz_decoders` is `#![cfg(feature = "memory")]`d to nothing without the feature. Declaring it
# here rather than relying on that keeps the manifest honest: a target that compiles to an empty
# binary and reports success is a test that has stopped testing.
[[test]]
name = "fuzz_decoders"
required-features = ["memory"]

[[bench]]
name = "band"
harness = false

[[bench]]
name = "cognition"
harness = false

[[bench]]
name = "group"
harness = false

[[bench]]
name = "flow"
harness = false

[[bench]]
name = "replication"
harness = false
