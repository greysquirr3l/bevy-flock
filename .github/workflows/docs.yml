# The site is the adoption path, so a broken build is a broken front door. This job builds it on every change to site/
# and fails on a build error rather than letting a broken page reach Pages.
name: docs

on:
  push:
    paths: ["site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/docs.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: the action reads `packageManager` from the manifest, so the lockfile and the tool that
      # wrote it cannot drift apart. It looks for `package.json` at the repository root by default, and this repository
      # keeps the site in `site/`, which is why `package_json_file` is not optional: without it the action fails with
      # "No pnpm version is specified" before a single page is built, and this whole job becomes decoration.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: install
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: build
        working-directory: site
        run: pnpm build
