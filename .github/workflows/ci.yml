name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint-future:
    name: Lints added after the pin
    runs-on: ubuntu-latest
    # Three lints exist in 1.99 and not in the pinned 1.97 toolchain: two clippy
    # (`unnecessary_rest_pattern`, `rest_pattern_accessible_field`) and one rustc
    # (`raw_borrows_via_references`). The manifest cannot name them — an unknown lint turns every
    # downstream build into an `unknown_lints` warning — so this job probes for them on a throwaway
    # file and enables the ones it finds.
    #
    # Everything here is pinned to `stable` with `+stable`/`rustup run stable`, because
    # rust-toolchain.toml pins 1.97.1 and rustup honours that file over the installed default: a
    # bare `cargo clippy` in this job would probe 1.97, find nothing, and check nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Probe for the lints the pin cannot name
        run: |
          set -u
          # A directory, so the file's stem is `probe` and not `tmp.a1b2c3`: a dot in a file stem
          # is a dot in a crate name, which rustc refuses.
          work="$(mktemp -d)"
          probe="$work/probe.rs"
          printf 'fn main() {}\n' > "$probe"
          flags=""
          # $1 is the driver, $2 the lint. Unknown = the toolchain does not have it yet;
          # any other error means the probe itself broke, which must not read as "supported".
          check() {
            local out status
            out=$(rustup run stable "$1" "$probe" -W "$2" --emit=metadata -o "$work/probe.rmeta" 2>&1)
            status=$?
            if printf '%s' "$out" | grep -q 'unknown lint'; then
              echo "$2: not known to $(rustup run stable rustc --version)"
              return 0
            fi
            if [ $status -ne 0 ] || printf '%s' "$out" | grep -q '^error'; then
              echo "probe for $2 failed:" >&2
              printf '%s\n' "$out" >&2
              return 1
            fi
            echo "$2: enabled"
            flags="$flags -D $2"
          }
          check clippy-driver clippy::unnecessary_rest_pattern || exit 1
          check clippy-driver clippy::rest_pattern_accessible_field || exit 1
          check rustc raw_borrows_via_references || exit 1
          if [ -z "$flags" ]; then
            echo "no post-pin lint is available on stable yet; nothing to check"
            exit 0
          fi
          # Only these three are denied here. The pinned job owns the rest of the spine: a newer
          # stable has newer nursery lints, and failing on tomorrow's diagnostics under today's
          # code would make this job noise instead of a forward check.
          # shellcheck disable=SC2086 # flags is a list built one lint at a time
          cargo +stable clippy --all-targets --all-features -- $flags
      - name: Check the drift catalogue
        run: python3 scripts/lint_drift.py --toolchain stable
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cap advisor states measured numbers; its self-test checks the tables still carry them
      # and that the recommendation reproduces every shape ADR 0032 measured.
      - run: python3 scripts/group_cap.py --self-test
      # The regression checker's thresholds, noise handling and fixture guards, without touching a compiler.
      - run: python3 scripts/scaling_regression.py --self-test
      # prose that restates a threshold drifts; the report and ADR must match the code and the baseline
      - run: python3 scripts/scaling_report.py --check
      # The lint policy lives in Cargo.toml and CI passes -D warnings; a file-level override would
      # turn a denied lint back into a suggestion, so the count of overrides is checked, not trusted.
      - run: python3 scripts/lint_audit.py --self-test
      - run: python3 scripts/lint_audit.py
      # The drift catalogue is a table in a page; its parser has to be checked without a compiler too.
      - run: python3 scripts/lint_drift.py --self-test
      # The Blender scripts under skills/ cannot run here, so their syntax and their shared contract
      # are checked instead: bpy is never imported by either check.
      - run: python3 -m py_compile scripts/*.py skills/*/scripts/*.py
      - run: python3 skills/bevy-flock-npc-animation-library/scripts/check_action_contract.py --self-test
      - run: python3 skills/bevy-flock-npc-animation-library/scripts/check_action_contract.py
      # Informational: capacity is machine-dependent, so this reports and never fails a runner.
      - run: python3 scripts/group_cap.py --check-plan plan.toml || true
  scaling-regression:
    name: Scaling regression
    runs-on: ubuntu-latest
    # Tolerance 2 in ADR 0034: three minutes measured, so a pathological sweep is cut rather than
    # quietly taxing every push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scaling
      # A reduced matrix: one thread per task, on the runner's own core count and on one core. The
      # comparison is on speedup, so a four-core runner is not "slower" than the six-core baseline.
      - name: Sweep (reduced matrix, two repeats per cell)
        run: |
          SHAPES="A" CORES="1 $(nproc)" CONC="1 2 4" REPEATS=2 FUNCS=1500 \
            scripts/scaling_sweep.sh /tmp/candidate.json
      - name: Compare with the recorded baseline
        run: |
          python3 scripts/scaling_regression.py docs/data/scaling-sweep.json /tmp/candidate.json \
            --fail-pct 25 --warn-pct 12 --json /tmp/scaling-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-verdict
          path: |
            /tmp/candidate.json
            /tmp/scaling-verdict.json
          if-no-files-found: ignore
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The extremes, because `--all-features` alone hides two whole classes of failure: a lint
      # expectation that only holds when a feature is on (`unfulfilled_lint_expectations` under
      # `-D warnings`), and a target that does not compile without one.
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --doc
      # Compile every target in both extremes, benches and examples included. A test that imports a
      # feature-gated module without declaring `required-features` fails the *target* rather than the
      # library, and that is exactly how `tests/memory_bridge.rs` sat broken on main. Checking rather
      # than testing keeps the benchmark harnesses out of the CI clock.
      - name: Compile every target (all features)
        run: cargo check --locked --all-targets --all-features
      - name: Compile every target (no default features)
        run: cargo check --locked --all-targets --no-default-features

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "serde"
          - "simd"
          - "navmesh"
          - "memory,serde"
          - "memory,serde,simd"
          - "navmesh,simd"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features --features "${{ matrix.features }}" --all-targets
      - run: cargo test --locked --lib --no-default-features --features "${{ matrix.features }}"

  release:
    # RELEASING.md promises this job: on a tag it repeats the checklist, checks the
    # type-level API against the last published release, and proves the package builds.
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true # no baseline tag before the first release
        with:
          feature-group: all-features
      - run: python3 scripts/group_cap.py --self-test
      - run: python3 scripts/scaling_regression.py --self-test
      - run: python3 scripts/scaling_report.py --check
      - run: python3 scripts/lint_audit.py
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "memory,serde"
          - "memory,simd"
          - "navmesh"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # docs/platforms.md claims these four configurations compile for wasm; this is the
      # job that keeps the claim true.
      - run: cargo check --locked --target wasm32-unknown-unknown --features "${{ matrix.features }}"
  portability:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate has no platform-specific code, and this job is what proves it stays
      # that way rather than merely being true today.
      - run: cargo test --locked --lib --all-features
  lockfile:
    name: Lockfiles current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A stale lockfile would let CI and the published numbers drift apart silently.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo metadata --locked --format-version 1 --manifest-path compat/Cargo.toml > /dev/null

  determinism:
    name: Determinism (/dev/urandom seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Randomised seed sweep
        run: |
          for i in 1 2 3; do
            cargo test --locked --test determinism -- --nocapture
          done

  msrv:
    name: MSRV (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  bench-smoke:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --bench crowd --no-run
      # The newer benches: cognition (the scheduler), groups, flow fields and the
      # replication wire format. They compile here and are run on demand locally.
      - run: cargo bench --locked --all-features --benches --no-run
  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # An example that does not run is a broken promise in the README, so the cheap
      # ones are executed rather than merely compiled.
      - run: cargo build --locked --all-features --examples
      - run: cargo run --release --locked --example hello_flock
      - run: cargo run --release --locked --example custom_behavior
      - run: cargo run --release --locked --all-features --example tavern_dialog
      - run: cargo run --release --locked --all-features --example ambient_metropolis

  cell-size-gate:
    name: Cell-size re-open gate (ADR 0031)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the frame at 13.5 m and 9 m
        run: >-
          cargo bench --locked --bench crowd -- flock_frame_cell
          --warm-up-time 0.5 --measurement-time 2 --sample-size 10
      - name: Fail if the finer grid is worth more than 10% of a frame
        run: python3 scripts/cell_size_gate.py --warn 3 --fail 10
  compat:
    name: Compat (v0.1.0-rc.1 reads current fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat
      # The forward direction: a released build reading files this tree wrote. Pinned
      # by tag in compat/Cargo.toml, so this job goes red when a format change would
      # break players rather than when a test notices (ADR 0014).
      - run: cargo run --locked --manifest-path compat/Cargo.toml
  demo:
    name: Demo (ashfall builds, tests and writes its artefacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      # The demo is a separate package on purpose, so nothing in the library's matrix above
      # builds it. Without this job a regenerated asset, a changed artefact schema or a crowd
      # that stops walking would go unnoticed until a human ran it.
      - name: Test the playground
        run: cargo test --release --manifest-path demo/Cargo.toml
      - name: Run a city and check what came out
        run: |
          cargo run --release --quiet --manifest-path demo/Cargo.toml -- \
            --population 500 --ticks 120 --out "$RUNNER_TEMP/ashfall"
          for artefact in ashfall.svg ashfall.scene.json ashfall.run.json manifest.json; do
            test -s "$RUNNER_TEMP/ashfall/$artefact"
          done
          python3 -c "import json,pathlib; run=json.loads(pathlib.Path('$RUNNER_TEMP/ashfall/ashfall.run.json').read_text()); assert run['population']==500, run; assert run['crowd_fingerprint']!='0x0000000000000000'; print('run.json ok', run['digest'], run['crowd_fingerprint'], run['ms_per_tick'], 'ms/tick')"
