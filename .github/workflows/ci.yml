name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cap advisor states measured numbers; its self-test checks the tables still carry them
      # and that the recommendation reproduces every shape ADR 0032 measured.
      - run: python3 scripts/group_cap.py --self-test
      - run: python3 -m py_compile scripts/*.py
      # Informational: capacity is machine-dependent, so this reports and never fails a runner.
      - run: python3 scripts/group_cap.py --check-plan plan.toml || true
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --doc

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "serde"
          - "simd"
          - "memory,serde"
          - "memory,serde,simd"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo test --locked --lib --no-default-features --features "${{ matrix.features }}"

  lockfile:
    name: Lockfiles current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A stale lockfile would let CI and the published numbers drift apart silently.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo metadata --locked --format-version 1 --manifest-path compat/Cargo.toml > /dev/null

  determinism:
    name: Determinism (/dev/urandom seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Randomised seed sweep
        run: |
          for i in 1 2 3; do
            cargo test --locked --test determinism -- --nocapture
          done

  msrv:
    name: MSRV (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  bench-smoke:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --bench crowd --no-run

  cell-size-gate:
    name: Cell-size re-open gate (ADR 0031)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the frame at 13.5 m and 9 m
        run: >-
          cargo bench --locked --bench crowd -- flock_frame_cell
          --warm-up-time 0.5 --measurement-time 2 --sample-size 10
      - name: Fail if the finer grid is worth more than 10% of a frame
        run: python3 scripts/cell_size_gate.py --warn 3 --fail 10
  compat:
    name: Compat (v0.1.0-rc.1 reads current fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat
      # The forward direction: a released build reading files this tree wrote. Pinned
      # by tag in compat/Cargo.toml, so this job goes red when a format change would
      # break players rather than when a test notices (ADR 0014).
      - run: cargo run --locked --manifest-path compat/Cargo.toml
