name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint-future:
    name: Lints added after 1.97
    runs-on: ubuntu-latest
    # The target profile denies two clippy lints that 1.97 does not have:
    # `unnecessary_rest_pattern` and `rest_pattern_accessible_field` are 1.99 additions, and the
    # manifest cannot name a lint the running toolchain does not know. This job turns them on when
    # the toolchain has them and says so when it does not, so the day the pin moves the tree is
    # already being held to them instead of discovering them in a release.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Probe for the 1.99 lints
        run: |
          # Three lints the pinned 1.97 toolchain cannot name, so they cannot live in Cargo.toml
          # without turning every build into an `unknown_lints` warning. Probed one at a time: a
          # toolchain may know some and not others.
          flags=""
          for lint in clippy::unnecessary_rest_pattern clippy::rest_pattern_accessible_field \
                      raw_borrows_via_references; do
            if cargo clippy --quiet -- -W "$lint" 2>&1 | grep -q "unknown lint"; then
              echo "$lint: not known to this toolchain"
            else
              echo "$lint: enabled"
              flags="$flags -W $lint"
            fi
          done
          if [ -z "$flags" ]; then
            echo "no post-1.97 lint is available here; nothing to check"
            exit 0
          fi
          # shellcheck disable=SC2086 # the flags are a list built one lint at a time
          cargo clippy --all-targets --all-features -- -D warnings $flags

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cap advisor states measured numbers; its self-test checks the tables still carry them
      # and that the recommendation reproduces every shape ADR 0032 measured.
      - run: python3 scripts/group_cap.py --self-test
      # The regression checker's thresholds, noise handling and fixture guards, without touching a compiler.
      - run: python3 scripts/scaling_regression.py --self-test
      # prose that restates a threshold drifts; the report and ADR must match the code and the baseline
      - run: python3 scripts/scaling_report.py --check
      # The lint policy lives in Cargo.toml and CI passes -D warnings; a file-level override would
      # turn a denied lint back into a suggestion, so the count of overrides is checked, not trusted.
      - run: python3 scripts/lint_audit.py --self-test
      - run: python3 scripts/lint_audit.py
      - run: python3 -m py_compile scripts/*.py
      # Informational: capacity is machine-dependent, so this reports and never fails a runner.
      - run: python3 scripts/group_cap.py --check-plan plan.toml || true
  scaling-regression:
    name: Scaling regression
    runs-on: ubuntu-latest
    # Tolerance 2 in ADR 0034: three minutes measured, so a pathological sweep is cut rather than
    # quietly taxing every push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scaling
      # A reduced matrix: one thread per task, on the runner's own core count and on one core. The
      # comparison is on speedup, so a four-core runner is not "slower" than the six-core baseline.
      - name: Sweep (reduced matrix, two repeats per cell)
        run: |
          SHAPES="A" CORES="1 $(nproc)" CONC="1 2 4" REPEATS=2 FUNCS=1500 \
            scripts/scaling_sweep.sh /tmp/candidate.json
      - name: Compare with the recorded baseline
        run: |
          python3 scripts/scaling_regression.py docs/data/scaling-sweep.json /tmp/candidate.json \
            --fail-pct 25 --warn-pct 12 --json /tmp/scaling-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-verdict
          path: |
            /tmp/candidate.json
            /tmp/scaling-verdict.json
          if-no-files-found: ignore
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The extremes, because `--all-features` alone hides two whole classes of failure: a lint
      # expectation that only holds when a feature is on (`unfulfilled_lint_expectations` under
      # `-D warnings`), and a target that does not compile without one.
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --doc
      # Compile every target in both extremes, benches and examples included. A test that imports a
      # feature-gated module without declaring `required-features` fails the *target* rather than the
      # library, and that is exactly how `tests/memory_bridge.rs` sat broken on main. Checking rather
      # than testing keeps the benchmark harnesses out of the CI clock.
      - name: Compile every target (all features)
        run: cargo check --locked --all-targets --all-features
      - name: Compile every target (no default features)
        run: cargo check --locked --all-targets --no-default-features

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "serde"
          - "simd"
          - "navmesh"
          - "memory,serde"
          - "memory,serde,simd"
          - "navmesh,simd"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features --features "${{ matrix.features }}" --all-targets
      - run: cargo test --locked --lib --no-default-features --features "${{ matrix.features }}"

  release:
    # RELEASING.md promises this job: on a tag it repeats the checklist, checks the
    # type-level API against the last published release, and proves the package builds.
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true # no baseline tag before the first release
        with:
          feature-group: all-features
      - run: python3 scripts/group_cap.py --self-test
      - run: python3 scripts/scaling_regression.py --self-test
      - run: python3 scripts/scaling_report.py --check
      - run: python3 scripts/lint_audit.py
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "memory,serde"
          - "memory,simd"
          - "navmesh"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # docs/platforms.md claims these four configurations compile for wasm; this is the
      # job that keeps the claim true.
      - run: cargo check --locked --target wasm32-unknown-unknown --features "${{ matrix.features }}"
  portability:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate has no platform-specific code, and this job is what proves it stays
      # that way rather than merely being true today.
      - run: cargo test --locked --lib --all-features
  lockfile:
    name: Lockfiles current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A stale lockfile would let CI and the published numbers drift apart silently.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo metadata --locked --format-version 1 --manifest-path compat/Cargo.toml > /dev/null

  determinism:
    name: Determinism (/dev/urandom seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Randomised seed sweep
        run: |
          for i in 1 2 3; do
            cargo test --locked --test determinism -- --nocapture
          done

  msrv:
    name: MSRV (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  bench-smoke:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --bench crowd --no-run
      # The newer benches: cognition (the scheduler), groups, flow fields and the
      # replication wire format. They compile here and are run on demand locally.
      - run: cargo bench --locked --all-features --benches --no-run
  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # An example that does not run is a broken promise in the README, so the cheap
      # ones are executed rather than merely compiled.
      - run: cargo build --locked --all-features --examples
      - run: cargo run --release --locked --example hello_flock
      - run: cargo run --release --locked --example custom_behavior
      - run: cargo run --release --locked --all-features --example tavern_dialog
      - run: cargo run --release --locked --all-features --example ambient_metropolis

  cell-size-gate:
    name: Cell-size re-open gate (ADR 0031)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the frame at 13.5 m and 9 m
        run: >-
          cargo bench --locked --bench crowd -- flock_frame_cell
          --warm-up-time 0.5 --measurement-time 2 --sample-size 10
      - name: Fail if the finer grid is worth more than 10% of a frame
        run: python3 scripts/cell_size_gate.py --warn 3 --fail 10
  compat:
    name: Compat (v0.1.0-rc.1 reads current fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat
      # The forward direction: a released build reading files this tree wrote. Pinned
      # by tag in compat/Cargo.toml, so this job goes red when a format change would
      # break players rather than when a test notices (ADR 0014).
      - run: cargo run --locked --manifest-path compat/Cargo.toml
