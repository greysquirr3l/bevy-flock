[package]
name = "bevy-flock-anim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Nick <greysquirr3l@users.noreply.github.com>"]
description = "Blended clip weights, gaze and gesture playback for bevy-flock crowds: the layer that makes a simulated crowd look alive."
repository = "https://github.com/greysquirr3l/bevy-flock"
homepage = "https://github.com/greysquirr3l/bevy-flock"
documentation = "https://docs.rs/bevy-flock-anim"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bevy", "animation", "crowd", "npc", "gamedev"]
categories = ["game-development", "animation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The ECS half, not the facade. The layer reads `Locomotion`, `GazeAim`, `NpcGestures`, `NpcTier` and the
# blackboard, all of which live there; depending on the facade instead would be the cycle this crate was
# split out of in ADR 0062.
bevy-flock-ecs = { version = "0.1.0", path = "../bevy-flock-ecs", default-features = false }
# The simulation types the layer reads (`SimClock`, `CognitionTier`, the deterministic numeric helpers).
bevy-flock-core = { version = "0.1.0", path = "../bevy-flock-core", default-features = false }
bevy_animation = "0.20.1"
bevy_app = "0.20.1"
bevy_asset = "0.20.1"
bevy_ecs = "0.20.1"
bevy_math = "0.20.1"
bevy_reflect = "0.20.1"
bevy_transform = "0.20.1"
thiserror = "2.0"
libm = "0.2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"

[[bench]]
name = "binding"
harness = false

[[test]]
name = "no_alloc"

[[example]]
name = "lod_cost"

[[example]]
name = "profile_gaze"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
# The same spine as the root package, restated rather than inherited: a workspace-wide `[workspace
# .lints]` table would move the denials out of the manifest that `scripts/lint_audit.py` verifies,
# and the audit is the thing that stops a lint being switched off quietly.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
todo = "deny"
unimplemented = "deny"
needless_pass_by_value = "deny"
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
missing_const_for_fn = "deny"
significant_drop_tightening = "deny"
