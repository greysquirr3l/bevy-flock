[package]
name = "bevy-flock-anim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Nick <greysquirr3l@users.noreply.github.com>"]
description = "Compatibility shim: the animation layer moved into bevy-flock behind the `anim` feature."
repository = "https://github.com/greysquirr3l/bevy-flock"
homepage = "https://github.com/greysquirr3l/bevy-flock"
documentation = "https://docs.rs/bevy-flock/latest/bevy_flock/anim/"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bevy", "animation", "crowd", "npc", "gamedev"]
categories = ["game-development", "animation"]

[dependencies]
# The layer itself. No other dependency: this package owns no code, so it must not own a version
# constraint either. `anim` is the feature that used to be the whole reason to depend on this crate.
bevy-flock = { version = "0.1.0", path = "../..", default-features = false, features = ["anim"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
# The same spine as the root package, restated rather than inherited: a workspace-wide `[workspace
# .lints]` table would move the denials out of the manifest that `scripts/lint_audit.py` verifies,
# and the audit is the thing that stops a lint being switched off quietly.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
todo = "deny"
unimplemented = "deny"
needless_pass_by_value = "deny"
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
missing_const_for_fn = "deny"
significant_drop_tightening = "deny"
