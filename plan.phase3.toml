# plan.phase3.toml — bevy-flock, phase 3: multi-threaded spatial partitioning
#
#   wiggum validate plan.phase3.toml
#   wiggum generate plan.phase3.toml --dry-run
#
# Phase 1 (plan.toml) built the simulation; phase 2 (plan.phase2.toml) built the shell around it and
# closed with T01–T11. This one attacks the single largest remaining cost in the frame and the last
# structural assumption left in the library: the spatial index is rebuilt and queried on one thread.
#
# Why this and not six other things: a million inhabitants fit in the current grid, and the frame still
# fits its budget, but only because the grid build and the neighbour queries run single-threaded and
# the numbers are carried by cache locality. ADR 0024's SIMD road and ADR 0021's bands both assume the
# index can be split; nothing in the crate currently proves it can. The risk is not "can we use rayon",
# it is whether a parallel build can produce the *same* neighbourhoods in the same order as the serial
# one, because determinism (ADR 0004) is the promise the whole crate is sold on.
#
# So the phase is ordered like a proof: a baseline that names the serial cost, an ADR that fixes the
# parallel invariants before any thread is spawned, a partitioned build, a partitioned query, a parity
# harness that compares serial and parallel results bit for bit over long runs, and only then the
# measurements that decide whether the win is real. Nothing in this phase may change a snapshot, a
# replay, or an observed neighbourhood membership; a task that cannot show that is a task that does not
# land.
#
# Execution groups derive from `depends_on` alone (ADR 0033); scripts/group_cap.py chooses how many run
# at once.
# ─── Project ──────────────────────────────────────────────────────────────────
[project]
name        = "bevy-flock"
description = """
bevy-flock is a crowd and NPC simulation engine for Bevy 0.20, and phase 3 is the work that takes the
spatial index from one thread to many without giving up determinism.
"""

language     = "rust"
path         = "/home/ubuntu/bevy-flock"
architecture = "hexagonal"

# Determinism first, numbers second: the invariants a threaded build must hold are the same ones the
# serial build already holds, and the measurements only decide how much the holding costs.
conventions = [
    "Strict lint policy: only six allows repo-wide, `unwrap`/`expect`/`panic`/indexing denied everywhere including tests, every exception audited by scripts/lint_audit.py with a reason and removing task.",
    "Determinism is a documented guarantee (ADR 0004): any change to iteration order, float accumulation order or hash iteration is a breaking change.",
    "Every task ends with fmt, clippy --all-targets -D warnings, tests and an audit run; commit author is Nick Campbell <s0ma@protonmail.com>.",
    "Numbers come from docs/performance.md with the machine named, and a bench that is not gated is a bench that is not a measurement.",
]

[[phases]]
name  = "Serial baseline and the parallel contract"
order = 1
description = "Before a second thread exists: measure what the serial index costs and fix, in an ADR, what a parallel one is allowed to change."
[[phases.tasks]]
slug = "serial-baseline"
kind = "research"
title = "Measure the serial spatial path as a gated baseline"
goal = "Turn the existing 1M-frame numbers into a per-phase baseline that names the cost of the grid build, the query, and the steering kernel separately, and gate it like the animation bench."
depends_on = []
hints = [
    "Add `benches/spatial.rs` to the root crate: build-only, query-only (a fixed ring of neighbour queries over a frozen grid), and the packed steering kernel over the same fixture.",
    "Reuse the existing fixtures rather than inventing a scene: the million-entity layout in benches/ is already the shape the phase must hold.",
    "Emit the same bencher format as the animation bench so `scripts/bench_gate.py` can compare it with a second baseline file, or factor that script to take a path per crate.",
    "Record the machine, the thread count and the build profile in docs/performance.md, next to the table, not in a commit message.",
]
test_hints = [
    "The bench builds and reports all three phases; the gate script fails a run that regresses by 25%.",
]
must_haves = [
    "`cargo bench -p bevy-flock --bench spatial` reports build, query and kernel separately",
    "A committed baseline file exists for the path and `bench_gate.py` checks it in CI",
    "docs/performance.md gains a table naming the serial cost of each phase at 1M",
]
evaluation_criteria = [
    "The three costs are separable: a change to one does not move the other two in the baseline",
    "The baseline records the machine and thread count",
]

[[phases.tasks]]
slug = "parallel-contract-adr"
kind = "research"
title = "ADR 0054: what a parallel spatial build may not change"
goal = "Fix, in writing and before any code, the invariants a threaded grid must preserve: neighbourhood membership, neighbour order, the RNG stream a body consumes, and the exact float sum the centroid uses."
depends_on = ["serial-baseline"]
hints = [
    "The decision is not 'use rayon'. It is which quantities are order-dependent, and for each one either a deterministic reduction or a documented reason it does not matter.",
    "Neighbour *membership* is a set; neighbour *order* is what the SIMD kernel's parity tests compare. Say which one the API promises and make the other internal.",
    "The scheduler already defines a per-body cost; a grid partition must not read it, because a cost that feeds back into partitioning makes the build non-idempotent.",
    "Cross-reference ADR 0004 (determinism), ADR 0024 (SIMD parity) and ADR 0029/0031 (volumetric cell sizing).",
]
test_hints = [
    "The ADR names each order-dependent operation and its resolution; a reviewer can check the list against the code without reading the whole file.",
]
must_haves = [
    "`docs/adr/0054-parallel-spatial-partitioning.md` exists and states the invariants",
    "Every invariant has a corresponding test named in the ADR",
]
evaluation_criteria = [
    "The ADR states whether neighbour order is part of the public contract",
    "The ADR states the reduction strategy for the centroid and any other float sum",
]

[[phases]]
name  = "Partitioned build"
order = 2
description = "Split the grid build across threads, once, without moving a single body's cell between runs."
[[phases.tasks]]
slug = "band-partitioned-build"
kind = "infrastructure"
title = "Partition the grid build by cell range and reduce deterministically"
goal = "Build the cell index in parallel over disjoint cell ranges, with per-thread posting buffers merged in a fixed order, so the resulting grid is bit-identical to the serial one."
depends_on = ["parallel-contract-adr"]
hints = [
    "Partition by cell, never by entity: an entity's cell is a pure function of its position, so a cell-partitioned build needs no coordination.",
    "Each thread counts into its own small histogram, prefix-sums locally, then the merge concatenates in cell order. Do not use a shared atomic counter for slots — the order of insertion would depend on scheduling.",
    "Keep the serial path intact behind the same API so the parity harness can compare both, and so a wasm or single-threaded build loses nothing.",
    "Thread count must come from the existing configuration, defaults to available parallelism, and must not change the output when it changes.",
    "Gate on a feature if rayon is a dependency you cannot accept by default; state the choice in the ADR.",
]
test_hints = [
    "Build the same 100k fixture with 1, 2, 3 and 8 threads and assert the grid bytes are equal.",
    "A property test: random positions, random thread counts, identical grids.",
]
must_haves = [
    "Parallel and serial builds produce byte-identical grids at 1, 2, 3 and 8 threads",
    "The serial path still compiles and runs without the parallel feature",
    "The build is measurably faster at 1M, or the task records that it is not and why",
]
evaluation_criteria = [
    "Grid equality is asserted over the raw buffers, not over a derived summary",
    "Thread count is configuration, not a constant baked into the partition",
]

[[phases.tasks]]
slug = "partitioned-queries"
kind = "infrastructure"
title = "Parallel neighbour queries with a deterministic gather"
goal = "Answer the per-body neighbour queries across threads and assemble the results in body order, so the steering kernel sees the same input sequence it sees today."
depends_on = ["band-partitioned-build"]
hints = [
    "The output is a per-body slice of neighbour indices; the assembly step is a deterministic scatter into a preallocated arena, sized from the total, with no per-body Vec.",
    "Chunk by body range, not by cell, so the output offset of every body is known before the work starts.",
    "Do not allocate per chunk: the arena is allocated once per frame and reused, exactly as the packed kernel already does.",
    "Keep the per-body neighbour cap and the cell radius semantics unchanged; this task changes who computes the answer, not what the answer is.",
]
test_hints = [
    "Serial and parallel neighbour lists are equal element-for-element over 10k random bodies.",
    "The arena does not reallocate after warm-up, asserted with the counting allocator the animation crate already uses.",
]
must_haves = [
    "Neighbour lists equal the serial ones element-for-element at 1, 2, 3 and 8 threads",
    "Zero allocations in the steady loop, asserted by a test",
    "Query time at 1M is measured against the serial baseline",
]
evaluation_criteria = [
    "Parity is asserted on the ordered neighbour list, not on a set",
    "The steady loop allocates nothing",
]

[[phases]]
name  = "Proof and payoff"
order = 3
description = "The harness that makes the parity claim checkable over long runs, then the measurements that decide whether the phase delivered."
[[phases.tasks]]
slug = "parity-harness"
kind = "audit"
title = "A serial-versus-parallel parity harness over long runs"
goal = "Prove that a 10,000-tick run with 100k bodies produces identical snapshots, identical scheduler decisions and identical neighbour lists whether the grid is built on one thread or eight."
depends_on = ["partitioned-queries"]
hints = [
    "Hash the snapshot bytes per tick and compare the two streams; the crate already digests snapshots for the save format, so reuse that digest rather than inventing a second one.",
    "Vary the thread count *within* a run as well as between runs, so a partition that only works at a fixed thread count fails here.",
    "Run it in CI at 10k bodies and 2k ticks for time, and as an ignored long test at 100k for a release gate.",
]
test_hints = [
    "A deliberately wrong reduction (insertion order instead of cell order) must fail this harness, otherwise it is testing nothing.",
]
must_haves = [
    "Serial and parallel runs produce identical per-tick digests at 1, 2, 3 and 8 threads",
    "Varying the thread count mid-run does not change the digest",
    "The harness fails when the reduction order is deliberately broken",
]
evaluation_criteria = [
    "The negative control is a real test that fails, not a comment claiming it would",
    "The long variant is documented with its runtime in docs/performance.md",
]

[[phases.tasks]]
slug = "thread-scaling-measurement"
kind = "research"
title = "Measure the scaling curve and decide whether the phase delivered"
goal = "Measure build, query and full-frame time at 1, 2, 4, 6 and 8 threads over the 1M population, compare against the serial baseline, and state the throughput ceiling the machine actually has."
depends_on = ["parity-harness"]
hints = [
    "Report per-phase scaling, not just frame time: a build that scales and a query that does not is the outcome that decides the next phase.",
    "Name the machine's core count and be explicit that a six-core VM is not a workstation; do not extrapolate to hardware that was not measured.",
    "If the curve is flat past four threads, say so and name the shared structure that stops it — the arena, the scheduler's queue or memory bandwidth.",
]
test_hints = [
    "The numbers land in docs/performance.md with the same fixtures the baseline used, so the comparison is like for like.",
]
must_haves = [
    "A scaling table exists for build, query and frame at five thread counts",
    "docs/performance.md states whether the phase met its goal, with the reason when it did not",
    "The gate baseline is re-recorded on the parallel path and the serial baseline kept for comparison",
]
evaluation_criteria = [
    "Per-phase numbers, not a single aggregate",
    "The conclusion is falsifiable: it names the number that would have meant success",
]

[[completed]]
task = "phase-3 T06 thread-scaling-measurement"
delivered_in = "feat/phase3-t06-t07-scaling-and-wiring"
note = """
`examples/scaling_sweep.rs` measures build, batch and frame at 1/2/4/6/8 workers over 1M bodies and 5,000
queries, median of five runs, and writes JSON lines; `scripts/spatial_scaling.py` prints the table and draws
docs/images/spatial-scaling.png from the same records. Verdict: frame 74.13 ms -> 15.96 ms (4.65x) on this
six-core aarch64 VM, so the phase met its 4x goal, but the split credits the batch (6.36x) and blames the
build (2.94x), whose serial prefix sum over ~15.6M cells is the flat part of the curve. Eight workers is
slower than six on every phase, which is why BoidsConfig::workers clamps to the machine count.
The baseline now carries the parallel cases beside the serial ones.
"""
[[completed]]
task = "phase-3 T07 ecs-wiring"
delivered_in = "feat/phase3-t06-t07-scaling-and-wiring"
note = """
The per-tick rebuild in `rebuild_spatial_grid` now takes its worker count from `BoidsConfig::workers`
(0 = the machine, anything larger clamped), so the partitioned build is what the ECS actually runs rather
than something only the bench exercises. `the_ecs_rebuild_is_identical_at_any_worker_count` spawns 2,000
bodies into a real App at 1, 2, 3 and 8 workers and requires one digest, so the wiring cannot drift from the
domain contract. This task was in the generated order list but never written into the phase, so it is added
here rather than claimed retroactively.
"""
[[completed]]
task = "phase-3 T03 band-partitioned-build"
delivered_in = "feat/phase3-t03-parallel-build"
note = """
`SpatialGrid::build` partitions its three O(n) passes across `with_threads(n)` workers; the prefix sum and
the cursor restore stay serial because they are what make every thread count produce identical arrays.
28.0 ms -> 10.0 ms at a million bodies on six cores (2.8x), measured by `examples/profile_build.rs`.
`every_thread_count_builds_identical_windows` compares `cell_start` and `order` byte for byte at 1/2/3/8.
"""

[[completed]]
task = "phase-3 T05 parity-harness"
delivered_in = "feat/phase3-t05-parity-harness"
note = """
`tests/spatial_parity.rs` folds every tick into one FNV-1a digest (all positions, the ordered neighbour
lists around 24 probes, and the scheduler's chosen set) and compares a serial run against 2, 3 and 8
threads plus a policy that changes the thread count every tick. Fast gate: 10,000 bodies x 2,000 ticks in
15 s release (100 ticks in debug, because a debug rebuild is 110x slower and would be timing the profile).
Release gate (#[ignore]): 100,000 bodies x 10,000 ticks, ~3.5 min extrapolated from a measured 200-tick run.
Both directions of sensitivity are tests, not claims: a body moved 1 mm must change the stream, and a
reduction in insertion order instead of cell order must change the digest.
"""

[[completed]]
task = "phase-3 T04 partitioned-queries"
delivered_in = "feat/phase3-t04-partitioned-queries"
note = """
`SpatialGrid::radius_batch` answers a whole crowd's queries into one reusable `QueryArena` with a fixed
`cap` stride per query, so the arena partitions by query range with no gather step and no per-query `Vec`.
1,000 queries at a million bodies: 5.48 ms serial, 1.07 ms on six workers (5.1x). Neighbour lists equal
the truncated serial answer element for element at 1, 2, 3 and 8 threads.
Steady-state allocation: zero on the serial path (asserted), and a measured bound of one scope packet per
worker on the parallel path — the earlier "no allocation" claim for the parallel build was wrong and is
corrected in the source and docs.
Open follow-up: a persistent worker pool, so the parallel paths can make the zero-allocation claim too.
"""

[[completed]]
task = "phase-3 T01 serial-baseline"
delivered_in = "feat/phase3-t01-t02"
note = """
`benches/spatial.rs` splits build, query and kernel; `benches/spatial-baseline.json` records them and
`scripts/bench_gate.py` now takes `--crate`/`--bench`/`--baseline` so both crates share one gate. At 1M:
47.2 ms to rebuild every body into cells, 6.5 µs per radius query, 677 ns per body for the scalar
reference kernel at 100k. docs/performance.md states what each number is and is not.
"""

[[completed]]
task = "phase-3 T02 parallel-contract-adr"
delivered_in = "feat/phase3-t01-t02"
note = """
ADR 0054: nine invariants a parallel build may not change, each with the test that holds it. Cell
membership stays pure, neighbour membership is public while order stays a stable internal property, the
merge runs in cell order with a shared atomic cursor banned, and thread count is configuration that
cannot change behaviour.
"""

[[completed]]
task = "phase-2 T01-T11"
delivered_in = "feat/phase2-anim-t07-11"
note = """
The animation crate, culling and LOD, tick-counted transitions, root motion with a digest, the measured
envelope and the adoption chapter. Phase 3 starts from that merged state.
"""
