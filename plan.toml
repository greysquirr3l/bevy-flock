    "Named system sets ordered explicitly: `FlockSet::{Input, Perception, Cognition, Steering, Integration, Cleanup, Diagnostics}` with `.chain()` inside each set and documented cross-set edges.",
    "Drive from `FixedUpdate` against a `SimTick` resource incremented by our own system, not `Time<Fixed>` elapsed — determinism requires the tick to be logical.",
    "Provide `FlockCommands` as an extension trait on `Commands`/`EntityCommands`: `spawn_npc()`, `spawn_flock(config)`, `despawn_npc()`, plus a queued `SpawnQueue` so spawning never mutates the world mid-iteration.",
    "Observer hooks: emit `NpcSpawned`, `NpcDespawned`, `NpcBecameAware`, `NpcTierChanged` events; a game hooks these instead of polling.",
    "Document the schedule with a diagram in the module docs.",
]
