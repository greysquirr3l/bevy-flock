# ─── Phase 2: Deterministic Core ─────────────────────────────────────────────

[[phases]]
name  = "Deterministic Core"
order = 2

[[phases.tasks]]
slug      = "domain-vocabulary"
kind      = "feature"
title     = "Domain vocabulary: identifiers, counts, ticks and typed errors"
goal     = "Define the newtypes every later module compiles against, so invalid values are unrepresentable at the boundary and transposed arguments cannot compile."
depends_on = ["workspace-scaffold"]
implements = ["api-ergonomics", "deterministic-simulation"]
hints = [
    "`NpcId(u32)`, `FlockId(u64)`, `GroupId(u32)`, `SlotId(u32)`: opaque, `Copy`, `Ord`, `Hash`, with `Display` and `Debug`. `NpcId` carries a namespace byte so recycled and unique populations cannot collide.",
    "`PopulationSize`: `try_new(usize) -> Result<Self, PopulationError>` enforcing 1..=1_000_000. No public field, no `From<usize>` — construction must be fallible.",
    "`Tick(u64)`, `TicksPerSecond(NonZeroU32)`, `Radius(f32)` rejecting NaN, negative and infinite values, `Weight(f32)` clamped to 0..=1 via `try_new`.",
    "`SimSeed(u64)` with a `SplitMix64`-derived `stream_for(NpcId) -> RngStream` so stream assignment is a pure function of seed and identity.",
    "`PopulationMode::{Unique, Recycled { slots: NonZeroU32 }}` with `Recycled` requiring at least one slot.",
    "Errors: `PopulationError`, `ConfigError`, `RegistrationError` via `thiserror`, each variant carrying the offending value and the valid range in its `Display`.",
    "No Bevy imports in this module. It must be usable from a server binary that never links rendering.",
]
test_hints = [
    "Boundary tests: 0 rejected, 1 accepted, 1_000_000 accepted, 1_000_001 rejected, and the error message names the range.",
    "`Radius::try_new(f32::NAN)` and `try_new(-1.0)` both return Err.",
    "Proptest: any `PopulationSize` round-trips through serde and through `u64` conversion.",
    "A compile-fail test (`trybuild`) proves `Radius` and `Tick` cannot be interchanged.",
]
must_haves = [
    "Every newtype is constructible only through a validating constructor.",
    "All error variants carry context, none are field-less.",
    "`#![deny(missing_docs)]` satisfied with examples on every public item.",
]
evaluation_criteria = [
    "No public function in the module accepts a bare `usize`/`f32` count, radius or weight.",
    "Error messages state the field, the value and the valid range.",
    "The module compiles with no Bevy dependency at all.",
]

[[phases.tasks]]
slug      = "deterministic-rng"
kind      = "feature"
title     = "Deterministic RNG streams with per-entity isolation"
goal     = "Provide a random number generator whose output is identical on every platform and whose streams are independent per entity, so adding an NPC never changes another NPC's fate."
depends_on = ["domain-vocabulary"]
implements = ["deterministic-simulation"]
hints = [
    "Implement PCG32 (or xoshiro256**) directly in `src/domain/rng.rs` — roughly 40 lines — instead of depending on `rand`, which would also pin a version the consumer must agree with.",
    "`RngStream` is `Clone` and seedable; `split()` derives child streams so a group can hand each member a stream without sharing state.",
    "All sampling helpers are explicit: `next_u32`, `next_bounded(u32)`, `next_f32_unit`, `next_range_f32`, `shuffle`, `choose_weighted` — all documented as deterministic and free of rejection-loop bias.",
    "Float sampling must be built from integer draws (`(bits >> 8) as f32 * 2^-24`) so results never depend on platform `f32` conversion rules.",
    "Expose a `StreamId` so a save file can restore a stream mid-sequence; offset storage as `(seed, draw_count)` rather than materialised state.",
    "Optional `bevy_rand` bridge behind a feature for projects already using it — do not make it a default dependency.",
]
test_hints = [
    "Golden vector tests: the first 16 outputs for seed 0 and seed 0xDEADBEEF are asserted against a checked-in expected array.",
    "Statistical smoke tests: 1,000,000 draws of `next_bounded(10)` produce each bucket within 1 percent of uniform; `next_f32_unit` stays in [0,1).",
    "Stream isolation: draws from `stream_for(NpcId(5))` are unchanged by draws from `stream_for(NpcId(6))`.",
    "Proptest: `next_range_f32(lo, hi)` never leaves [lo, hi) for 100,000 random ranges.",
]
must_haves = [
    "No dependency on `rand` in the core.",
    "Golden vectors committed and asserted.",
    "Every sampling helper documents its determinism guarantee.",
]
evaluation_criteria = [
    "The same seed produces identical output in a debug build, a release build and a wasm build (assert via the CI golden test).",
    "No `HashMap` iteration, `SystemTime` or `thread_rng` anywhere in the module.",
]

[[phases.tasks]]
slug      = "temperament-and-needs"
kind      = "feature"
title     = "Temperament, needs and mood model"
goal     = "Give NPCs a personality and internal drives that produce visibly different behaviour from the same code, without any behaviour code having to special-case personality."
depends_on = ["domain-vocabulary", "deterministic-rng"]
implements = ["pluggable-logic", "deterministic-simulation"]
hints = [
    "`Temperament` holds the five OCEAN dimensions plus three game-facing axes (bravery, sociability, industriousness) as `Weight`s, with `Temperament::sample(&mut RngStream)` drawing from a configurable distribution and `Temperament::archetype(Brave|Timid|Merchant|Guard|... )` presets.",
    "`Needs` holds a fixed-size array of named need channels (energy, hunger, social, safety) with per-channel decay and satisfaction rates; fixed-size so it is `Copy` and allocation-free.",
    "`Mood` is a derived scalar/valence-arousal pair updated by decay and events, clamped, with hysteresis-free continuous integration at a fixed tick.",
    "All step functions take `Tick` and `RngStream` explicitly and return new values — no `&mut self`, no interior mutability, so the domain stays trivially testable and parallelisable.",
    "Provide `NeedChannel` indices as `const` rather than strings; string lookup is a debug-only convenience.",
    "Document the model in the module docs with the actual formulas so a game designer can reason about tuning.",
]
test_hints = [
    "Property test: after any number of steps, every need and mood value stays within [0, 1] and never becomes NaN.",
    "Decay is monotonic: with zero satisfaction, need values strictly decrease over ticks.",
    "Two NPCs with identical seeds and identical temperaments evolve identically; differing temperaments diverge measurably within 100 ticks.",
    "Archetype presets sample within their documented bands.",
]
must_haves = [
    "No heap allocation in the per-tick update path.",
    "Formulas documented with worked examples.",
    "Deterministic given (state, tick, stream).",
]
evaluation_criteria = [
    "The module has zero Bevy imports and zero global state.",
    "Behaviour authors can read a temperament and predict which behaviour will win (documented mapping).",
]

[[phases.tasks]]
slug      = "archetype-generator"
kind      = "feature"
title     = "Procedural NPC generation: names, looks, backgrounds"
goal     = "Generate plausible, varied, reproducible NPCs — name, temperament, needs, role, faction lean, appearance seed — deterministically from a world seed and an index."
depends_on = ["temperament-and-needs"]
implements = ["population-spawning", "deterministic-simulation"]
hints = [
    "Generation is a pure function `generate(seed, index, &ArchetypeTable) -> NpcBlueprint`; the same triple always yields the same blueprint, and generation order does not matter.",
    "Name generation uses syllable templates (onset/vowel/coda pools) plus a curated surname list behind a `NameStyle` (Nordic, Latin, trade-city, and so on) — no runtime data downloads, no `rand` crate.",
    "`ArchetypeTable` maps weight → archetype (guard, merchant, urchin, noble) and drives temperament sampling, default loadout tags and dialogue category.",
    "Uniqueness has to be measured, not assumed: generate 100,000 blueprints and assert the collision rate stays under the documented threshold, with a suffix rule that breaks ties deterministically.",
    "`NpcBlueprint` is `Serialize`/`Deserialize` behind the `serde` feature so a game can author NPCs offline and load them.",
    "Appearance is a seed plus tag list, never asset paths — the crate must not know what a mesh is.",
]
test_hints = [
    "Determinism: generating blueprint 1000 after 0..1000 matches generating it in isolation.",
    "Distribution: 10,000 blueprints produce every archetype above its configured minimum share.",
    "Uniqueness: 100,000 names contain fewer than the documented percentage of duplicates.",
    "Golden test: a checked-in table of 32 blueprints for seed 42 must not drift.",
]
must_haves = [
    "Generation is pure and index-addressable.",
    "Name collision rate measured and documented.",
    "Golden blueprint table committed.",
]
evaluation_criteria = [
    "No file I/O, no network, no `rand` dependency in the generator.",
    "Blueprint generation of 100,000 NPCs stays under the documented allocation budget (measured in the benchmark task).",
]

[[phases.tasks]]
slug      = "spatial-grid"
kind      = "feature"
title     = "Deterministic spatial grid with neighbour queries"
goal     = "Answer radius, k-nearest and cone queries in logarithmic-to-constant time without hash iteration order, so crowd code is both fast and reproducible."
depends_on = ["domain-vocabulary"]
implements = ["crowd-motion", "deterministic-simulation"]
hints = [
    "Uniform grid over a rectangular bounds with `CellSize` derived from the largest query radius; cell storage is a flat `Vec` indexed by `z * (h * w) + y * w + x`, not a `HashMap`.",
    "Each cell holds `SmallVec<[NpcId; 8]>`; insertion order is the deterministic sort key, and queries return results sorted by `(distance_squared, NpcId)`.",
    "Rebuild each tick from a caller-supplied slice of positions (structure-of-arrays), with a `rebuild_dirty` path that only moves agents whose cell changed.",
    "API: `radius(center, r, &mut out)`, `nearest(center, k, &mut out)`, `within_cone(center, dir, half_angle, r)`, `cell_at(point)`, `for_each_cell`, all allocation-free given a reusable `QueryScratch` buffer.",
    "Guard the pathological case: a cell containing 10,000 agents must still answer quickly, so document and test the behaviour when a single cell dominates.",
    "Auto-tune cell size from agent density at construction, and expose the choice in the stats snapshot.",
]
test_hints = [
    "Equivalence property test: for 200 random worlds and 50 random queries each, grid results equal an O(n^2) brute-force scan exactly, including ordering.",
    "Boundary test: agents exactly on a cell border are found exactly once, never zero and never twice.",
    "Empty-grid and single-agent cases are covered.",
    "Benchmark: 100,000 agents, radius query returning ~20 neighbours, under the documented nanosecond target.",
]
must_haves = [
    "No `HashMap` in the module.",
    "Results are deterministically ordered.",
    "Allocation-free steady state proven with a counting allocator test.",
]
evaluation_criteria = [
    "Brute-force equivalence test passes with ordering compared, not just set equality.",
    "`cargo tree` shows no spatial-index dependency — this is hand-written.",
]

[[phases.tasks]]
slug      = "steering-model"
kind      = "feature"
title     = "Composable steering behaviours with crowd stability"
goal     = "Implement separation, alignment, cohesion, seek, flee, arrive, wander and obstacle avoidance as weighted, composable steering forces that stay stable in dense crowds."
depends_on = ["spatial-grid"]
implements = ["crowd-motion"]
hints = [
    "Each behaviour is a small `fn(&AgentContext, &[Neighbour], &mut Vec3)` writing into a shared accumulator; composition is priority-weighted truncation (the classic Reynolds `prioritized_dithering`) rather than naive summation, so avoidance is never outvoted.",
    "Steering outputs a desired velocity; a separate integrator clamps to `MaxSpeed`, applies `MaxAcceleration`, and damps. Keep them separate so a physics adapter can take over integration.",
    "Stability rules that must be implemented and documented: velocity-squared damping near a destination, a dead-zone radius below which separation is scaled down, and a jitter threshold that snaps sub-epsilon velocity to zero.",
    "Obstacle avoidance uses time-to-collision against capsule/sphere primitives from a caller-supplied slice — no physics dependency in the core.",
    "All vector math via glam 0.33; any transcendental (atan2 for cone tests, sin/cos for wander) goes through `libm`.",
    "Provide `SteeringWeights` as a newtype with sane defaults per preset, and document what each weight does to the crowd's look.",
]
test_hints = [
    "Separation invariant: after settling, no two agents are inside the sum of their radii.",
    "Rest stability: a crowd at rest produces total kinetic energy below the jitter threshold for 300 ticks.",
    "Boids invariants: 200 agents with alignment converge toward a shared heading (angular variance decreases over 500 ticks).",
    "Obstacle test: no agent's segment from previous to next position intersects an obstacle capsule at 5x max speed.",
    "Golden test: a fixed scenario's positions at tick 100 are asserted to a tolerance.",
]
must_haves = [
    "No `std::f32::sin`/`cos`/`atan2` in the module.",
    "Weighted truncation implemented, not naive summation.",
    "Every stability rule has a test that fails without it.",
]
evaluation_criteria = [
    "Dense-crowd test with 1,000 agents in a small box shows no oscillation artefact in a committed plot or numeric trace.",
    "A physics adapter can replace integration without touching behaviour code.",
]

[[phases.tasks]]
slug      = "flow-field-pathing"
kind      = "feature"
title     = "Hierarchical flow fields for destination-driven crowds"
goal     = "Let thousands of NPCs share one computed path field per destination, so crowd pathfinding costs one solve instead of one per agent."
depends_on = ["spatial-grid"]
implements = ["crowd-motion", "deterministic-simulation"]
hints = [
    "Two-tier grid: a coarse navigation grid (baked from an obstacle list or supplied by an adapter) and a per-destination flow field cached in an LRU keyed by destination cell.",
    "Field construction uses an integer-cost Dijkstra/BFS with a binary heap over the coarse grid; costs are fixed-point integers so tie-breaking is deterministic across platforms.",
    "Lookup is O(1): agent position → cell → direction vector, with bilinear sampling between cells for smooth motion and a fallback to direct seek inside the destination cell.",
    "Stamp invalidation: a `NavVersion` counter lets a game rebuild the grid (door opened, bridge destroyed) and drop stale fields without leaking them.",
    "Budget the solve: a large field build may be split across frames via a resumable solver with a per-frame node budget, reported through stats.",
    "Document the memory cost precisely: bytes per cell, bytes per cached field, and the default cache size.",
]
test_hints = [
    "Arrival test: 500 agents through a wall with one gap all reach the destination within the tick limit and never enter an obstacle.",
    "Equivalence: field-derived path cost equals an independent A* path cost on the same grid for 100 random pairs.",
    "Determinism: identical fields for identical grids and destinations, verified by hash.",
    "Unreachable destination returns a documented sentinel and agents hold position rather than jitter.",
    "Benchmark: 250,000-cell field build under the documented millisecond target; 10,000 lookups under the documented nanosecond target.",
]
must_haves = [
    "Integer costs, deterministic tie-breaking.",
    "Resumable solver with a node budget.",
    "Memory cost documented with real numbers.",
]
evaluation_criteria = [
    "No per-agent pathfinding in the crowd path — proven by the benchmark scaling flat as agent count rises.",
    "Field cache eviction is LRU and leak-free (test asserts bounded memory over 10,000 rebuilds).",
]

# ─── Phase 3: ECS Surface ────────────────────────────────────────────────────

[[phases]]
name  = "ECS Surface"
order = 3

[[phases.tasks]]
slug      = "ecs-core-plugin"
kind      = "feature"
title     = "FlockPlugin, components and named schedules"
goal     = "Wire the deterministic core into Bevy with an explicit schedule, components that hold simulation state, and a plugin whose ordering is documented rather than incidental."
depends_on = ["domain-vocabulary", "deterministic-rng"]
implements = ["api-ergonomics", "headless-parity"]
hints = [
    "`FlockPlugin` with `FlockConfig` (population, mode, seed, tick rate, budgets, presets) inserted as a resource; `app.add_plugins(FlockPlugin::new(config))` is the single entry point.",
