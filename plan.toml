    "`docs/adr/` records, one file each, numbered as they already are in the tree: 0001 collapsed hexagonal layout; 0002 deterministic PCG32 streams per NPC; 0003 the spatial grid and the two designs that lost to it; 0004 `libm` transcendentals; 0005 budgeted spawning; 0006 trees and state machines together; 0007 no renderer, physics or networking in the core; 0008 fallible constructors and no panic paths; 0009 the virtual-cost fair-queue think scheduler.",
