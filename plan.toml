evidence = """`demo/` is a separate package (own `[workspace]`, like `compat/`) with a bin, a library and nine tests. It builds a six-district city from a seed (large/medium/small/tiny classes, keyed NPC placement, 2096 ruined blocks, 10 shelters, 10 pylons, 44 stalls), spawns a crowd through `FlockPlugin`, places it into the districts and steps it.

Six models were generated with Meshy from six concept images and shipped as GLBs: three bodies (gatewarden, aerie, scavenger) and three props (pylon, shelter-door, market-stall), 12,654 to 5,971 triangles each. `demo/tools/shrink_glb.py` re-encodes the embedded 2K base-colour maps and re-lays the binary chunk with geometry, accessors and indices byte-identical, taking 22.9 MB to 2.4 MB (89%); heights were then measured off the shipped meshes through `--report` and recorded in the asset table, so a scale error is a table error.

The artefacts are the point: `ashfall.svg` (a top-down plan), `ashfall.scene.json` (engine-agnostic instances grouped by model, the `build_render_plan` contract written down), `ashfall.run.json` (seed, library digest, positional crowd fingerprint, tier histogram, wall time, per-asset fingerprints) and `manifest.json`. Rendering is deliberately absent: a demo that needs a GPU cannot run in CI.

Three findings came out of building it, and all three are in the demo's README: the library's `digest` is coarse by design and matches across seeds, so the demo adds `crowd_fingerprint` over quantised positions; `App::new()` has no `TimePlugin`, so `integrate_flock`'s frame delta is zero and a headless crowd stands still (`the_crowd_walks` is the test that caught it); and the default crowd weights walk everyone to one intersection, so the demo disables cohesion. `tests/assets.rs` is the asset gate the ported Meshy skill asks for: every promised file opened, its glTF version and geometry checked, its animation absence asserted, its size held to a 1.2 MB budget and the total under 4 MB."""

