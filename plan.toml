# ─── Phase 5: Society and Voice ─────────────────────────────────────────────

[[phases]]
name  = "Society and Voice"
order = 5

[[phases.tasks]]
slug      = "subject-clamp-diagnostic"
kind      = "refactor"
title     = "Refuse a subject count above the ceiling instead of clamping it"
goal      = "A game that asks for more subjects than the store can hold currently gets the maximum and a store that silently refuses every relationship past it. Make that request fail loudly at construction, so the failure mode ADR 0015 had to diagnose cannot recur."
depends_on = []
implements = ["social-memory"]
hints = [
    "MemoryStore::new clamps with `subjects.clamp(1, MAX_SUBJECTS)`; remembering a subject past the stride returns false and a caller is free to ignore it. That is how a sixteen-subject ceiling went unnoticed for a whole feature cycle.",
    "Add `ConfigError::TooManySubjects { requested, max }` and return a Result from a fallible constructor, keeping `new` as the clamping variant for callers who mean 'the maximum'. ADR 0008 already established fallible constructors for exactly this shape of mistake.",
    "A doc test must show the error, and a unit test must prove the clamp still works for callers who ask for the maximum deliberately.",
]
must_haves = [
    "MUST fail at construction, not at the first remember() that would be rejected.",
    "MUST keep the clamping path available and documented, because `MAX_SUBJECTS` as an argument is a legitimate idiom.",
    "MUST not change the save format: the ceiling is a runtime bound, and identifiers in a file are already bounded by it.",
]
evaluation_criteria = [
    "When a store is constructed with MAX_SUBJECTS + 1, the fallible constructor returns TooManySubjects naming both numbers.",
    "When a store is constructed with exactly MAX_SUBJECTS, it succeeds and every subject slot is addressable.",
    "When the clamping constructor is used with a larger request, it stores MAX_SUBJECTS and its doc comment says so.",
]
test_hints = [
    "Assert `remember` succeeds for subject MAX_SUBJECTS - 1 after a construction at the ceiling.",
    "Assert the error renders the requested and maximum counts, since this error is read by a developer at startup.",
]

