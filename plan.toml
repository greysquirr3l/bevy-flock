[[phases.tasks]]
slug      = "memory-in-cognition"
kind      = "feature"
title     = "Memory as a cognition input"
goal     = "Make what an NPC remembers available to behaviour trees and utility scoring, and define the promotion threshold where a scalar relationship becomes authored content."
depends_on = ["utility-scoring", "encounter-perception"]
implements = ["social-memory", "pluggable-logic", "dialog-and-barks"]
hints = [
    "Cost the memory leaves as leaves: declare what a store read measures, let the calibration gate defend it, and re-pin the archetype table when a branch is added — ADR 0011.",
    "Expose memory to leaves through the blackboard: `memory_valence`, `memory_familiarity` and `memory_flags` keys written once per think, so a tree reads integers and never touches the store.",
    "A `Recall` leaf family: `HasGrudge`, `RemembersSubject`, `FamiliarityAbove`. They are leaves like any other and declare their cost, so the calibration gate covers them.",
    "Utility scoring reads the same keys; a consideration that scales with familiarity is enough to make a guard who knows you behave differently from one who does not.",
    "Promotion: when a slot crosses a configured threshold (familiarity and valence magnitude), emit a `PromotableRelationship` event. The library stores the scalar; dialogue and naming decide what the NPC says about it.",
    "Wire the built-in archetypes: guards gain a grudge branch, merchants a familiarity discount, urchins a fear response. Every change is visible in the pinned cost table.",
    "Memory writes stay in the perception stage; cognition only reads, so a think is still a pure function of components, blackboard and store.",
]
test_hints = [
    "A guard whose subject attacked it selects the hostile branch; the same guard with no memory does not.",
    "A merchant who remembers a subject offers the discount branch; a stranger does not.",
    "Decayed memory produces the neutral branch without any explicit clearing step.",
    "Promotion fires once per relationship, not once per tick.",
    "The pinned archetype cost table is updated deliberately when a branch is added.",
    "Determinism test: a scripted encounter sequence produces the same branch choices on two runs.",
]
must_haves = [
    "Leaves read integers from the blackboard; nothing in a tick reaches into the store.",
    "Promotion is an event, not hard-coded dialogue.",
    "Archetype trees still cost what the calibration table says.",
]
evaluation_criteria = [
    "The think cost with memory enabled is measured and stays inside the documented budget at 10,000 NPCs.",
    "A game can disable the built-in branches and keep the store, or keep the store and ignore the branches.",
]
[[phases.tasks]]
slug      = "dialog-graph-engine"
kind      = "feature"
title     = "Dialogue graphs, facts and conversation state"
goal     = "Conversations as data: a directed graph of lines, choices and conditions evaluated against typed facts, with guaranteed termination and resumable state."
depends_on = []
implements = ["dialog-and-barks", "deterministic-simulation"]
hints = [
    "Node kinds: `Line { speaker, text_key, next }`, `Choice { options }`, `Condition { predicate, then, else }`, `Action { effect, next }`, `End`. `text_key` is a localisation key plus optional authored fallback text — never a hard-coded English string in the engine.",
    "Predicates are typed: `Fact(FactId)`, `Compare(FactId, Cmp, i64)`, `And/Or/Not`, `Temperament(Cmp, Weight)`, `HasTag(TagId)`. No string evaluation, no scripting engine, no `eval`.",
    "Facts: `FactStore` per NPC with typed ids, integer and boolean values, and a provenance tag for debugging (`learned_from`, `tick`).",
    "Termination rule: a conversation keeps a visited-node counter; exceeding `max_nodes_per_conversation` without a state change ends it with `ConversationEnd::LoopGuard`. Document the number and why.",
    "Conversation state is a plain serialisable struct so a save mid-conversation restores exactly, including the pending choice index.",
    "RON loader behind `serde`, with validation at load (dangling `next`, unreachable nodes reported as warnings, cycles reported as info).",
]
test_hints = [
    "Traversal: choosing option 2 twice follows the authored path and ends at the terminal node.",
    "Fact gating: absent fact takes the fallback branch; present fact takes the gated branch.",
    "Loop guard: a self-referential graph terminates with `LoopGuard` rather than hanging.",
    "Save/restore mid-conversation resumes at the same node and choice index.",
    "Validation: a graph with a dangling `next` fails to load with a typed error naming the node.",
]
must_haves = [
    "No string evaluation anywhere.",
    "Termination guaranteed by construction.",
    "Conversation state serialisable mid-flight.",
]
evaluation_criteria = [
    "Loading an invalid graph produces an actionable error, never a panic.",
    "A 5,000-node graph loads and validates in the documented time budget.",
]

[[phases.tasks]]
slug      = "bark-system"
kind      = "feature"
title     = "Ambient barks with priority, cooldown and anti-repetition"
goal     = "Make a crowd feel alive: the right line from a random NPC at the right moment, rate-limited so it never becomes noise."
depends_on = ["dialog-graph-engine", "lod-think-scheduler"]
implements = ["dialog-and-barks", "cognition-budget"]
hints = [
    "`BarkCatalog`: entries with category, priority, cooldown ticks, per-category and global concurrency limits, context tags (`night`, `rain`, `combat`, `market`), and weight.",
    "Selection: filter by context and cooldown, weight by priority and recency, then pick deterministically from the entity's stream. Least-recently-used suppression prevents the same line twice in a row from the same NPC.",
    "Global rate limit: a per-frame `BarkBudget` (default 8) means 1,000 NPCs wanting to speak do not produce 1,000 audio triggers; the winners are chosen by priority then `NpcId` for determinism.",
    "Spatial audibility: only barks inside the listener radius are emitted as audio events; outside it they are recorded for stats only, so a million-NPC city does not melt the audio thread.",
    "Interruption: a higher-priority bark cancels a lower-priority one for the same speaker, and cancellation is an event.",
    "The engine emits `BarkEvent { speaker, category, line_key, position }` — it never plays audio, never loads assets.",
]
