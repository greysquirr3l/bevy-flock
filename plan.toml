title     = "Cost-model calibration gate"
goal      = "Keep declared virtual costs honest: measure every registered leaf on a fixed runner and fail the build when the model drifts by more than 20 percent."
depends_on = ["cognition-extension-api", "lod-think-scheduler"]
implements = ["cognition-budget", "observability"]
hints = [
    "`benches/cost_model.rs` measures every registered built-in leaf with one criterion group per leaf, so a regression names itself in the report.",
    "`tests/cost_model.rs` runs the same measurement as an assertion: 100,000 iterations per leaf, median, compared against the declared `VirtualCost`; the failure message carries declared, measured and the corrected value to paste.",
    "Tolerance is 20 percent, and the comparison is against a reference table generated by the bench on the fixed runner, not against absolute nanoseconds. Only relative costs set fairness shares, so absolute drift on other hardware is expected and harmless; drift in the model is the failure being caught.",
    "CI gets a `cost-model` job on the same runner class as `bench.yml`, required on every pull request, plus a nightly drift report that warns without failing so a runner fleet change is visible before it breaks the gate.",
    "Document the re-calibration ritual in `docs/performance.md`: measure, update the declaration, regenerate the reference table, and state the reason in the commit message.",
    "A leaf that declares no cost is not a silent default: the gate lists uncalibrated leaves and the scheduler charges `VirtualCost::DEFAULT`, which is deliberately pessimistic so an undeclared leaf cannot hide as cheap.",
]
