    "Plugin registration test: `App::new().add_plugins(FlockPlugin::default())` runs 100 updates without panicking and reports the configured population.",
    "Schedule ordering test: a probe resource records set execution order and asserts the documented order.",
    "Determinism test: two apps with the same seed produce the same `SimTick` and the same digest after 100 updates.",
]
must_haves = [
    "No simulation logic in `lib.rs` or the plugin; systems delegate to domain functions.",
    "Schedule order documented and tested.",
    "Works with `MinimalPlugins` only (headless).",
]
evaluation_criteria = [
    "`cargo test --no-default-features` runs the plugin tests without any rendering plugin.",
    "Every component has a doc comment stating who writes it and when.",
]

[[phases.tasks]]
slug      = "staged-spawn-pipeline"
kind      = "feature"
title     = "Budgeted, streaming population spawn"
goal     = "Spawn 1 to 1,000,000 NPCs without a frame hitch by draining a queue against a per-frame entity budget, with progress a game can render."
depends_on = ["ecs-core-plugin", "archetype-generator"]
implements = ["population-spawning"]
hints = [
    "`SpawnQueue` resource holds pending ranges, not materialised blueprints; draining generates on demand so a million-NPC request costs kilobytes until it drains.",
    "`SpawnBudget { entities_per_frame, max_micros }` — whichever limit is hit first stops the drain for that frame.",
    "Recycled mode keeps a `SlotPool` free-list; despawning returns the slot so identities are reused deterministically (lowest free slot first).",
    "Emit `SpawnProgress { spawned, total }` every frame while draining, and `SpawnComplete` once.",
    "Cancellation: `cancel_spawn()` drops pending ranges and despawns what was already spawned, returning the population to its pre-request state exactly.",
    "Guard against a game calling `spawn_flock` twice with conflicting seeds — document the merge rule and test it.",
]
test_hints = [
    "Spawn 100,000 at 2,000 per frame: drains in 50 frames, final count exact, no frame exceeds budget by more than 25 percent.",
    "Recycled pool: despawn 100 of 500, respawn 100, assert live count 500 and that the freed slot ids were reused.",
    "Cancellation test: cancel mid-drain leaves zero NPCs and no queued work.",
    "Determinism: two runs with the same seed produce the same `NpcIdentity` sequence regardless of budget size.",
]
must_haves = [
    "No O(n) blueprint materialisation before draining.",
    "Recycled mode reuses slot identities deterministically.",
    "Progress and completion events emitted.",
]
evaluation_criteria = [
    "A 100,000-NPC spawn shows no single frame over budget in the recorded per-frame trace.",
    "Changing the budget changes how long the spawn takes but not which NPCs exist.",
]

[[phases.tasks]]
slug      = "lod-think-scheduler"
kind      = "feature"
title     = "Virtual-cost fair-queue think scheduler"
goal      = "Dispatch cognition against a virtual-nanosecond budget with start-time fair queueing, so cost is bounded, replay is exact and no NPC can starve."
depends_on = ["ecs-core-plugin"]
implements = ["cognition-budget", "deterministic-simulation"]
hints = [
    "Social memory raises weight, never eligibility: apply a clamped permille boost at dispatch time, exclude it from the share that derives tier, and never release memory because a think was skipped — ADR 0011 states why each of those is load-bearing.",
    "`VirtualCost(u64)` in domain is a declared cost in virtual nanoseconds. The registry sums `LeafBehavior::cost_hint` per logic unit and caches the sum on the NPC as `ThinkCost`, refreshed when its logic changes; undeclared logic gets `VirtualCost::DEFAULT` and is listed by the calibration gate rather than panicking.",
    "`ThinkBudget { virtual_nanos }` on the config, and `ThinkWeight(u16)` per NPC in 1..=1000 produced by a weight policy (distance bands, group directive priority, player focus) with hysteresis on the band rather than on a tier.",
    "Selection is start-time fair queueing over integer tags: tag = max(start, vt) + (cost * 1024) / weight; dispatch the minimum (tag, NpcId); vt becomes the dispatched tag; stop when spent >= budget. No float appears anywhere in the arithmetic.",
    "max(start, vt) is load-bearing, not defensive. Without it an NPC that idled while others thought accrues credit and then monopolises the queue; ship the test that fails when it is removed.",
    "Detail tiers are an output: derive `LodTier` for culling, rendering and stats from measured think share and distance, and report per-tier counts in `ThinkStats`. The scheduler never branches on tier.",
    "Overshoot is bounded by one dispatch because the budget is checked before each think. Expose `max_think_cost()` so a game can size its budget against its most expensive tree.",
    "Determinism: the dispatched set is a pure function of ready set, tags, weights, declared costs and budget, all integers in simulation state. Record the dispatched `NpcId` list in the tick log so a replay consumes it verbatim instead of recomputing it.",
    "`ThinkStats { virtual_spent, real_nanos, dispatched, deferred, per_tier }` refreshes each tick. `real_nanos` is instrumentation and must never feed a decision.",
]
test_hints = [
    "10,000 ready NPCs with a 2,000,000 vns budget: the dispatched set equals the fair-queue prefix and overshoot is at most one declared tree cost.",
    "Starvation bound: 10,000 NPCs with mixed weights over 1,000 ticks; no NPC exceeds ceil(cost * total_weight / (budget * weight)) + 1 ticks between thinks.",
    "Replay: run 1,000 ticks, then rerun with every declared cost multiplied by four; the dispatched NpcId sequence is identical.",
    "Fairness: weight 4 thinks four times as often, plus or minus one dispatch, as weight 1 over 1,000 ticks.",
    "No credit accumulation: park an NPC for 500 ticks, wake it, and assert it takes at most one dispatch before the queue catches up.",
    "Hysteresis: 60 boundary crossings produce at most 2 weight-band changes.",
]
must_haves = [
    "No wall-clock read anywhere in the scheduling path.",
    "All tag, weight and cost arithmetic is integer.",
    "The maximum think interval is bounded and asserted, with no promotion special case.",
]
evaluation_criteria = [
    "No `Instant::now()`, `SystemTime` or `Time` resource read in `src/application` or `src/domain`; grep proves it.",
    "The dispatched set is identical between the baseline run and a run whose declared costs are scaled by four.",
    "The queue is a total order: a shuffled ready set produces the same dispatch sequence.",
]

[[phases.tasks]]
slug      = "ambient-population-tier"
kind      = "feature"
title     = "Continuum ambient population that materialises into entities"
goal     = "Represent a million inhabitants as a density field, then solidify them into real NPCs as the player approaches and dissolve them on the way out, conserving population."
depends_on = ["staged-spawn-pipeline", "spatial-grid"]
implements = ["ambient-tier", "crowd-motion"]
hints = [
    "`AmbientField`: per-cell population mass (`f32`), mean velocity, dominant archetype mix, and a per-cell RNG stream derived from `(seed, cell)`. Memory is O(cells), not O(inhabitants).",
    "Flow: a coarse advection step moves mass between cells toward attractors (market, gate, home) using the same integer-cost field machinery; document the model as a continuum approximation, not a fluid solver.",
    "Materialisation: when a cell enters the player's radius, pop `min(cell_mass, entity_budget_share)` individuals, generate them from the cell's stream with the cell's archetype mix, and subtract the mass.",
    "Dematerialisation: when leaving, fold each entity's state back into its cell's mass and archetype mix, then despawn it — this is where conservation is won or lost, so it is the most heavily tested function in the module.",
    "Conservation invariant: total mass before == total mass after, within a documented epsilon, and entity count + ambient mass equals the configured total at all times.",
    "Fallback: when the entity budget cannot absorb the demand, materialise a representative subset and emit `MaterialisationShortfall { omitted }`.",
    "Document the visual continuity approach: entities spawn at the cell's mean position with the cell's archetype, so the transition reads as people appearing in a crowd, not popping in.",
]
test_hints = [
    "Conservation property test: 1,000 random materialise/dematerialise cycles keep total mass within epsilon.",
    "Determinism: the same approach path at the same ticks produces the same individuals (identity comparison, not count).",
    "Budget shortfall emits exactly one event with the omitted count matching entity arithmetic.",
    "Perf: 1,000,000 inhabitants simulated at 60 Hz headless, measured and pasted.",
    "Zero-mass cell materialises nothing and does not allocate.",
]
must_haves = [
    "Ambient state memory is O(cells) and measured.",
    "Conservation test passes for 1,000 cycles.",
    "Materialisation is deterministic and identity-stable.",
]
evaluation_criteria = [
    "The 1,000,000-inhabitant benchmark runs at 60 Hz headless with numbers committed.",
    "No per-inhabitant entity exists at rest — proven by entity count in the test.",
]

# ─── Phase 4: Cognition ─────────────────────────────────────────────────────

[[phases]]
name  = "Cognition"
