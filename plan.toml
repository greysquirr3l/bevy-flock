]
must_haves = [
    "Every built-in leaf has a declared cost and a generated reference measurement.",
    "The gate fails the build, not merely a benchmark, when the model drifts.",
]
evaluation_criteria = [
    "A deliberate 3x cost regression in one leaf is caught by CI with that leaf named.",
    "The reference table is machine-generated and checked in, with the generating command documented.",
]

