    "Budget: 1,000 simultaneous requests with a limit of 8 produce exactly 8, chosen deterministically.",
    "Anti-repetition: the same NPC never emits the same line twice in a row across 1,000 draws.",
    "Audibility: a bark 10x outside the radius produces no audio event but does increment stats.",
    "Interruption emits a cancellation event with the replaced line id.",
]
must_haves = [
    "Deterministic selection under budget pressure.",
    "No audio or asset dependency in the crate.",
    "Cooldown and concURRENCY limits tested at their boundaries.",
]
evaluation_criteria = [
    "A 10,000-NPC scene emits at most the configured barks per frame, verified by the event count in a test.",
    "Designers can add a bark category without touching engine code (data-driven catalog test).",
]

