hints = [
    "`Consideration` = (input extractor, response curve, weight). Curves: linear, quadratic, inverse, logistic, step, and a `PiecewiseCurve` for designer-shaped responses.",
    "Score composition is the standard multiplicative form with a compensation factor, documented with the formula and why multiplication beats averaging for gating.",
    "Inhibition: a behaviour can veto another (`Fear inhibits Chat`) without competing on score, which is how you get believable social behaviour without a giant weight table.",
    "Deterministic selection: highest score wins, ties broken by registration order, never by hash order. Record the full score vector for the trace/explain path.",
    "Cooldowns and one-shot behaviours integrate with the tree as decorators rather than as special cases in the scorer.",
    "Explainability is a requirement, not a nicety: `ExplainSelection` returns candidate ids, raw scores, weights and the winning reason, and the observability task consumes it.",
]
