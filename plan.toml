[[phases.tasks]]
slug      = "memory-store"
kind      = "feature"
title     = "Social memory store and cold tier"
goal     = "Give an NPC a bounded, deterministic memory of the subjects it has met, sized by who is eligible to remember rather than by how many NPCs exist."
depends_on = ["domain-vocabulary", "deterministic-rng"]
implements = ["social-memory", "deterministic-simulation"]
hints = [
    "Flat slot array indexed `memory_index × subjects + subject`; one allocation for the whole crowd. A `Vec` per NPC is the shape this decision exists to reject, and the ADR says why.",
    "`MemorySlot` is sixteen bytes with the size asserted at compile time, because the cost model is `capacity × subjects × 16` and a careless field would double it.",
    "`MemoryIndex` is issued by `enrol` and stored on the entity, the way `NpcId` is; the store keeps no map from `NpcId` to a row.",
    "Valence blends three parts history to one part news, in `i32` arithmetic with an explicit saturating conversion, so one bad afternoon does not erase a friendship.",
    "Decay halves the *magnitude* and reapplies the sign. Arithmetic `>>` on a negative value converges to -1, which would make a grudge permanent at one point of hostility — a test must pin the value reaching zero.",
    "`DecayPolicy::NONE` exists because a game may want a grudge that never fades, and that has to be expressible rather than a special case.",
    "The cold tier is a bounded `BTreeMap` with eviction by lowest total familiarity then lowest `NpcId`; iteration order is part of the eviction rule, so a hash map is the wrong container.",
    "`release` returns a `NpcMemories` the caller can drop, park or serialise. The library must not pick a retention policy for the game.",
    "`implant` restores a slot exactly; reconstructing by replaying encounters would decay it twice and lose the original encounter kind.",
    "Free-list reuse is LIFO and double release is a no-op, so a churning eligibility set never hands one row to two NPCs.",
]
test_hints = [
    "Slot size asserted as a test as well as a const, so a future refactor that pads the struct fails loudly.",
    "Blend test with exact expected integers for help-then-attack and attack-then-help.",
    "Saturation test: 70,000 encounters leave counts at `u16::MAX` rather than wrapping.",
    "Decay test across the half-life boundaries, asserting the faded value is exactly zero and that `NONE` never decays.",
    "Sweep test proving only faded rows are freed and the freed count is exact.",
    "Archive test proving the faintest record is evicted and ties break by identifier.",
    "Round-trip test: release, park, restore, and recall the original valence, encounters and flags.",
    "Determinism test: two stores fed identical events agree on every decayed read.",
    "Rejection test: an unknown index, an out-of-range subject and a double release all fail without writing.",
    "Benchmark asserting the per-NPC cost of remember, recall, decayed recall and sweep.",
]
must_haves = [
    "Store allocation is sized by capacity and subjects, asserted in a test.",
    "Decay is lazy, integer, and reaches zero.",
    "Cold tier evicts deterministically.",
    "Retention policy lives in the caller, not the store.",
]
evaluation_criteria = [
    "Recall costs single-digit nanoseconds per NPC in the benchmark.",
    "Sweeping a full store is measured and documented as a slow-cadence operation, not a per-frame one.",
    "The ADR records why per-NPC vectors, hash maps and embeddings were rejected.",
]
