# plan.toml — bevy-flock: a crowd and NPC simulation engine for Bevy
#
#   wiggum validate plan.toml
#   wiggum generate plan.toml --dry-run
#   wiggum generate plan.toml
#
# Only `[project].path` needs editing if the checkout lives somewhere other
# than ~/Projects/bevy-flock.

# ─── State of this plan ───────────────────────────────────────────────────────
# This file is a work queue, not a changelog: [[phases.tasks]] holds what is left,
# and [[completed]] below records what shipped, with the commit and the code that
# proves it. Wiggum generates task files from the phases only, so a finished task
# left in the queue would ask an agent to rebuild something that exists.
#
# 28 of 50 tasks delivered, at v0.1.0-rc.1 plus the 1M milestone work after it:
# the deterministic core (identifiers, PCG32 streams, ticks, spatial index,
# steering), the Bevy surface (plugin, components, budgeted spawning, budgeted
# cognition), the behaviour trees with declared costs and the calibration gate, the
# virtual-cost scheduler and the cognition tiers, the ambient continuum and the
# three-band adapter that carries 1,000,000 inhabitants in 3.80 ms with 5,000
# thinking, social memory with a measured footprint and a versioned save format
# with its compatibility corpus, the packed steering kernel with its four-agent
# wide path, CI across three operating systems and six feature combinations, and
# the measurement record that all of it is judged against.
#
# 268 library tests plus nine integration suites; clippy clean on the MSRV
# (1.97.1); 25 ADRs; gates 1 to 9 closed by the boundary harness.
#
# Execution groups are derived from `depends_on` alone: they encode ordering, not capacity. Group 1
# schedules eleven tasks, which is correct for dependencies and wrong for a six-core machine — run
# scripts/group_cap.py to choose how many to take at once (policy: ADR 0033).
#
# Seven of the tasks below are partially delivered; each carries a hint naming what
# is in place and what is missing, so nobody re-does the former or mistakes it for
# the whole. The rest are untouched.

# ─── Project ──────────────────────────────────────────────────────────────────

[project]
name        = "bevy-flock"
description = """
bevy-flock is a crowd and NPC simulation engine for Bevy 0.20. It spawns one
NPC or a million, gives every NPC / every group / the whole population
pluggable cognition, and keeps the result deterministic enough to replay.

The design targets three scales at once:

  * 1–10,000 named NPCs, spawned unique or recycled, with full per-entity
    brains, dialogue, factions and relationships.
  * 100,000 simulated NPCs inside a 16.6 ms budget on a single desktop core
    budget, using a think-scheduler that spends a virtual-nanosecond allowance
    against declared, calibrated costs. It is a weighted fair queue rather than
    a hand-tuned "think every N frames" fudge, and it replays exactly because no
    wall clock ever enters the decision.
  * 1,000,000+ ambient inhabitants that exist as a continuum population
    field — a density/velocity model, not entities — which materialise into
    real ECS entities as the player approaches and dissolve back when they
    leave. Population mass is conserved across the transition.

Nothing in the simulation core touches rendering, physics, networking or
storage. The core depends on bevy_app, bevy_ecs and bevy_math only, so it
runs headless on a server, in CI, and in the browser, and the same systems
drive 2D and 3D projects. Everything heavier — avian physics, sprite and
mesh instancing, moonshine snapshots, bevy_replicon, egui inspectors — is an
opt-in adapter behind a feature flag.

Determinism is a hard constraint, not a nice-to-have: a seed plus a command
log reproduces a run on every platform, which is what makes replay, rollback,
golden tests and CI performance gates possible at all.
"""
language     = "rust"
path         = "/Users/nick/Projects/bevy-flock"
architecture = "hexagonal"

# ─── Preflight ────────────────────────────────────────────────────────────────

[preflight]
build = "cargo build --workspace --all-targets --all-features"
test  = "cargo test --workspace --all-features"
lint  = "cargo clippy --all-targets --all-features -- -D warnings"
audit = "cargo deny check"

# ─── Orchestrator ─────────────────────────────────────────────────────────────

[orchestrator]
persona     = "You are a principal Rust engineer who ships libraries other people depend on. You have built crowd simulation, ECS engines and deterministic lockstep netcode. You measure before you claim, you write the test before the fix, and you never describe work as complete that a reviewer could falsify in five minutes."
strategy    = "complete"
max_retries = 3
on_failure  = "pause"
require_evaluator = true
gates = ["release-publish"]
rules = [
    "Bevy 0.20.1, Rust edition 2024, stable toolchain only — no nightly features anywhere in the crate or CI.",
    "Pin glam to 0.33 to match Bevy 0.20. glam 0.34 exists on crates.io; do not take it. Verify with `cargo tree -d -i glam` after any dependency change.",
    "The simulation core may depend on bevy_app, bevy_ecs and bevy_math only. `cargo check --no-default-features` must succeed with no rendering, physics, storage or networking code compiled.",
    "Every optional integration — avian, sprites/meshes, moonshine, replicon, egui — lives behind a feature and is reachable only through an adapter module.",
    "Never use `.unwrap()`, `.expect()` or panicking indexing on Result/Option in library code. Use `?`, `let else`, or explicit match. Tests may use them.",
    "No `#[allow(clippy::...)]`. Fix the lint, or use `#[expect(...)]` with a comment naming the reason the lint cannot be satisfied.",
    "The crate is `#![deny(unsafe_code)]`. If a profiled hot path genuinely needs unsafe, it must be a single module, documented in ARCHITECTURE.md, and covered by a test plus a Miri run.",
    "Determinism: no `HashMap`/`HashSet` iteration order in simulation paths; no wall-clock time in simulation logic; no `std` transcendental floats (sin/cos/exp/ln/atan2) in simulation math — use `libm` so results match across platforms and libc versions.",
    "Determinism: parallel work may only write per-entity components. Any cross-entity reduction must be order-independent or explicitly sorted before it accumulates.",
    "Deterministic simulations use `f32` storage with fixed tick counts (`u64` ticks, never elapsed seconds) and document epsilon tolerances at comparison points.",
    "Library errors use `thiserror`. Public fallible APIs return a narrow domain error type; no `anyhow` in the library, `anyhow` is fine in examples and benches.",
    "Parse, don't validate: untrusted input — counts, weights, seeds, RON assets, dialog files — is converted once at the boundary into newtypes that cannot hold an invalid value.",
    "Pass time and context explicitly (`Tick`, `SimRng`, budgets) into domain functions. No globals, no `Time<Virtual>` reads inside pure logic.",
    "Public API surface: every public item is documented with a rustdoc example that is compiled as a doctest, is `#[must_use]` where a dropped value is a bug, and follows the naming rules in `docs/api-conventions.md`.",
    "Prefer the standard library and our own implementations in the core over new dependencies. A new dependency needs a one-paragraph justification in the task notes and an ADR in `docs/adr/`.",
    "Feature-gate aggressively but keep the feature set small and orthogonal; run `cargo hack check --each-feature` before declaring any task complete.",
    "Cross-platform from day one: no Unix-only assumptions, no path separators, no `std::time::Instant` in tests that assert timing, and `wasm32-unknown-unknown` must keep compiling.",
    "Every system gets a doc comment explaining what it reads, what it writes and where it sits in the schedule. Schedules are named and ordered explicitly, never implicitly by insertion order.",
    "Performance claims must be backed by a benchmark in `benches/` that a reviewer can run with one command. Numbers in docs come from a committed run on a named machine.",
    "Leave the codebase more legible than you found it: if a file passes 500 lines, split it by concern in the same task.",
]

# ─── Evaluator ────────────────────────────────────────────────────────────────

[evaluator]
persona        = "You are a hostile reviewer for a game-engine library. You assume the implementer reported success without evidence. You run the benchmarks, read the tests, grep for the forbidden patterns, and check the public API against the documented contract before scoring anything."
pass_threshold = 8
hard_fail      = true
test_tool      = "cargo test --workspace --all-features"
mode           = "blocking"
contract_review = true

[[evaluator.criteria]]
name        = "tests-and-invariants"
weight      = 25
description = "All tests pass, including the property tests and golden determinism tests added by the task; new public behaviour is covered by at least one test that fails if the implementation is stubbed out."

[[evaluator.criteria]]
name        = "determinism"
weight      = 20
description = "No HashMap iteration order, wall-clock time, std transcendentals or unsorted parallel reduction appears in simulation paths. A seeded run reproduces byte-identical snapshot digests."

[[evaluator.criteria]]
name        = "performance-budget"
weight      = 15
description = "The task's benchmark exists, was actually run, and meets the stated budget (10k NPCs under 16.6 ms; 100k under the documented thinking budget) with numbers pasted into the completion notes."

[[evaluator.criteria]]
name        = "api-ergonomics"
weight      = 15
description = "The public surface matches docs/api-conventions.md: newtypes over primitives, builders return Self, errors are typed, every public item has a compiled doctest, and a new user can spawn a working crowd in five lines."

[[evaluator.criteria]]
name        = "documentation"
weight      = 15
description = "Module-level docs explain the design decision, not the syntax. ARCHITECTURE.md and the relevant ADR are updated in the same task as the code."

[[evaluator.criteria]]
name        = "safety-and-lints"
weight      = 10
description = "Clippy runs clean with the project profile and -D warnings, no new #[allow], no unsafe outside the audited module, and no panic path reachable from public API with valid input."

# ─── Capabilities ─────────────────────────────────────────────────────────────

[[capabilities]]
name        = "population-spawning"
title       = "Population Spawning and Recycling"
description = "Spawn any number of NPCs from 1 to over a million, either as unique individuals or as a recycled pool, without frame hitches."
requirements = [
    "MUST accept a population size of 1..=1_000_000 at configuration time and reject 0 with a typed error, never a panic.",
    "MUST support two spawn modes: `Unique` (every NPC is generated once and never duplicated) and `Recycled { slots }` (a fixed pool of slot identities reused as NPCs despawn).",
    "MUST spread spawning across frames according to a per-frame entity budget so that spawning 100,000 NPCs never blocks a frame for longer than the configured budget.",
    "MUST generate every NPC from a seeded stream so that the same seed and count produce the same individuals in the same order on every platform.",
    "MUST expose spawn progress as an event a game can render a loading screen from.",
]
[[capabilities.scenarios]]
name = "single-npc"
when = "a game configures a population of 1 and calls the spawn extension on App"
then = "exactly one NPC entity exists after the next update, with a generated name, temperament and need set"
[[capabilities.scenarios]]
name = "ten-thousand-unique"
when = "a game spawns 10,000 NPCs in Unique mode with a fixed seed"
then = "10,000 distinct NPC identities exist, all names are non-empty, and a second run with the same seed produces the same identity sequence"
[[capabilities.scenarios]]
name = "recycled-pool"
when = "a 500-slot recycled population despawns 100 NPCs and spawns 100 replacements"
then = "the population stays at 500 live NPCs and the replacements reuse the freed slot identities"
[[capabilities.scenarios]]
name = "zero-rejected"
when = "a game asks for a population of 0"
then = "a typed `PopulationError::Empty` is returned and no entity is spawned"
[[capabilities.scenarios]]
name = "budgeted-spawn"
when = "100,000 NPCs are queued with a 2 ms per-frame spawn budget"
then = "no single frame exceeds the budget by more than 25 percent and the queue drains to completion"

[[capabilities]]
name        = "pluggable-logic"
title       = "Pluggable Cognition at Three Scopes"
description = "Behaviour, dialogue and decision logic can be supplied by the game at the individual, group and population scope, without forking the crate."
requirements = [
    "MUST let a game register custom leaf behaviours, custom utility considerations, custom state machines and custom director logic through a single registration entry point.",
    "MUST let a game replace cognition entirely for one entity by attaching its own component and opting that entity out of the built-in scheduler.",
    "MUST keep every extension trait object-safe so behaviours can be stored in a registry keyed by a stable identifier.",
    "MUST reject duplicate registrations of the same identifier with a typed error at app-build time, not at runtime in the middle of a frame.",
    "MUST document each extension point with a runnable example under `examples/`.",
]
[[capabilities.scenarios]]
name = "custom-leaf"
when = "a game registers a `Greet` leaf behaviour and gives it to 50 NPCs"
then = "those NPCs evaluate `Greet` on their think tick and no other NPC does"
[[capabilities.scenarios]]
name = "full-takeover"
when = "a game attaches its own brain component and marks the entity `ExternalCognition`"
then = "the built-in scheduler skips that entity and never overwrites its behaviour output"
[[capabilities.scenarios]]
name = "duplicate-registration"
when = "a game registers two behaviours under the same identifier"
then = "app construction returns a typed registration error naming the identifier"
[[capabilities.scenarios]]
name = "group-directive"
when = "a group director issues a `TakeCover` directive to a 200-member group"
then = "all 200 members transition to cover-seeking behaviour within their configured think latency"

[[capabilities]]
name        = "deterministic-simulation"
title       = "Deterministic Simulation"
description = "The same seed, the same inputs and the same tick count always produce the same world state, on every platform."
requirements = [
    "MUST drive all simulation from a fixed logical tick, never from wall-clock elapsed time.",
    "MUST give every NPC its own seeded RNG stream derived from the world seed and a stable entity identifier, so adding or removing one NPC does not shift another's random draws.",
    "MUST avoid hash-map iteration order, pointer order and thread scheduling in any code path that affects simulation state.",
    "MUST route every transcendental float operation in simulation math through `libm` for bit-stable results across platforms.",
    "MUST produce a stable 64-bit state digest of the simulation for a given tick, comparable across runs and machines.",
]
[[capabilities.scenarios]]
name = "same-seed-same-state"
when = "two runs use the same seed, the same NPC count and 1,000 identical ticks"
then = "both runs report the same state digest at tick 1,000"
[[capabilities.scenarios]]
name = "stream-isolation"
when = "one NPC is added at index 0 after the world is seeded"
then = "every pre-existing NPC draws the same values it drew before, apart from the shifted index"
[[capabilities.scenarios]]
name = "no-hash-order"
when = "the same simulation runs with a shuffled entity insertion order"
then = "the final digest is unchanged"
[[capabilities.scenarios]]
name = "cross-platform"
when = "the determinism suite runs on Linux, macOS and Windows CI"
then = "the golden digests are identical on all three"

[[capabilities]]
name        = "cognition-budget"
title       = "Virtual-Cost, Fair-Queue Cognition Budget"
description = "Cognition cost per frame is bounded by a budget of virtual nanoseconds dispatched through a weighted fair queue, so the frame is bounded, the tick replays exactly and no NPC starves."
requirements = [
    "MUST charge every think a declared virtual cost summed from the registered logic units, and MUST dispatch against a per-frame budget of virtual nanoseconds rather than wall-clock time.",
    "MUST select the dispatched set by start-time fair queueing over integer tags with a total tie-break order, so the set is a pure function of tick, weights, declared costs and queue state.",
    "MUST guarantee a bounded maximum think interval for every weight class, derived from the budget and the total weight, and prove it by test rather than by a promotion rule bolted on top.",
    "MUST treat near/mid/far/ambient detail as an output of the scheduler, used for culling, rendering and stats, never as an input cadence; hysteresis applies to weight bands, not to tier boundaries.",
    "MUST calibrate declared costs against measured costs on a fixed runner in CI and fail the build when any registered logic unit drifts by more than 20 percent.",
    "MUST report real versus virtual time per tick in stats only, and MUST NOT read real elapsed time in any scheduling decision.",
]
[[capabilities.scenarios]]
name = "budget-respected"
when = "10,000 NPCs are ready to think on the same tick with a budget of 2,000,000 virtual nanoseconds"
then = "the dispatched set is a prefix of the fair-queue order and the frame exceeds the budget by no more than one tree's declared cost"
[[capabilities.scenarios]]
name = "starvation-bound"
when = "an NPC of the lowest weight is ready every tick for 1,000 ticks"
then = "it thinks at least once per ceil(cost * total_weight / (budget * weight)) + 1 ticks, asserted over the whole run"
[[capabilities.scenarios]]
name = "replay-under-speed-difference"
when = "a 1,000-tick run is replayed with every declared cost multiplied by four, simulating a machine four times slower"
then = "the dispatched NpcId sequence is identical to the original run"
[[capabilities.scenarios]]
name = "tier-is-an-output"
when = "the budget is halved at runtime"
then = "every NPC's think interval grows proportionally and the reported per-tier counts follow, with no tier configuration edited"
[[capabilities.scenarios]]
name = "weight-raises-share"
when = "one NPC's weight is raised from 1 to 4"
then = "it thinks four times as often, plus or minus one dispatch, over 1,000 ticks"
[[capabilities.scenarios]]
name = "cost-model-drift"
when = "a logic unit's measured cost exceeds its declared cost by more than 20 percent"
then = "the cost-model gate fails the build and names the leaf together with the corrected value"

[[capabilities]]
name        = "crowd-motion"
title       = "Crowd Motion, Steering and Pathing"
description = "Flocking, avoidance and navigation that scale to dense crowds without per-agent pathfinding."
requirements = [
    "MUST implement separation, alignment, cohesion, target seeking and obstacle avoidance as composable steering behaviours with per-behaviour weights.",
    "MUST answer neighbour queries from a deterministic uniform-grid spatial index, not an O(n^2) scan or an unordered hash map.",
    "MUST support destination-driven crowds through flow fields computed once per destination and shared by every NPC heading there.",
    "MUST keep agents stable in dense configurations: no oscillation, no jitter at rest, no tunnelling through static obstacles at high speed.",
    "MUST let a game substitute its own navigation source (navmesh, waypoint graph, hand-authored field) through a single trait.",
]
[[capabilities.scenarios]]
name = "flock-cohesion"
when = "200 boids spawn within a 20-unit radius with cohesion and separation enabled"
then = "mean nearest-neighbour distance stays within the configured band and no pair penetrates the separation radius after settling"
[[capabilities.scenarios]]
name = "grid-matches-brute-force"
when = "the spatial grid answers a radius query for a random world"
then = "the result set matches an O(n^2) reference scan exactly"
[[capabilities.scenarios]]
name = "flow-field-arrival"
when = "500 NPCs are given a destination behind an obstacle wall with a single gap"
then = "every NPC reaches the destination without entering the obstacle, within the documented tick limit"
[[capabilities.scenarios]]
name = "rest-stability"
when = "a crowd is at its destination with zero input for 300 ticks"
then = "total kinetic energy falls below the jitter threshold and no agent oscillates"
[[capabilities.scenarios]]
name = "custom-nav-source"
when = "a game implements the navigation trait with a hand-authored waypoint graph"
then = "NPCs follow it without any change to steering or cognition code"

[[capabilities]]
name        = "dialog-and-barks"
title       = "Dialogue Graphs and Ambient Barks"
description = "Conversations, ambient vocalisations and the knowledge model that lets NPCs remember what happened."
requirements = [
    "MUST represent conversations as a directed graph of line, choice, condition, action and end nodes, loaded from a data file or built in code.",
    "MUST evaluate node conditions against typed facts and NPC state, with no string evaluation and no scripting engine.",
    "MUST guarantee termination: cyclic graphs are allowed, but a conversation that loops without state change is cut off by a documented rule.",
    "MUST implement barks with priority, cooldown, per-category concurrency limits and least-recently-used anti-repetition.",
    "MUST allow external providers (LLM, TTS, localisation service) to supply line text through a trait, resolved outside the simulation tick.",
]
[[capabilities.scenarios]]
name = "dialog-traversal"
when = "a conversation starts at the root node and the player picks choice 2 twice"
then = "the emitted line sequence matches the authored graph and the conversation ends at a terminal node"
[[capabilities.scenarios]]
name = "fact-gating"
when = "a node is gated on the fact `met_player` and the NPC has not met the player"
then = "the node is skipped and the fallback branch is taken"
[[capabilities.scenarios]]
name = "bark-cooldown"
when = "the same bark category is requested on 60 consecutive ticks with a 120-tick cooldown"
then = "it fires once, not 60 times"
[[capabilities.scenarios]]
name = "bark-budget"
when = "1,000 NPCs all want to bark on the same tick with a per-frame limit of 8"
then = "exactly 8 barks are emitted, chosen by priority then deterministic tie-break"
[[capabilities.scenarios]]
name = "provider-fallback"
when = "an external line provider returns an error for a node"
then = "the authored fallback line is used and the error is surfaced as an event, not a panic"

[[capabilities]]
name        = "ambient-tier"
title       = "Continuum Ambient Population"
description = "A population tier that represents hundreds of thousands of inhabitants as a density field and materialises individuals on demand."
requirements = [
    "MUST represent ambient population as per-cell mass and flow rather than entities, so a million inhabitants cost kilobytes, not gigabytes.",
    "MUST materialise an ambient cell into individual NPC entities when the player approaches and dematerialise them when the player leaves, preserving identity where the configuration allows.",
    "MUST conserve population mass across materialisation and dematerialisation within a documented tolerance.",
    "MUST keep materialisation deterministic: the same approach path at the same tick produces the same individuals.",
    "MUST degrade gracefully when materialisation would exceed the entity budget, materialising a representative subset and reporting the shortfall.",
]
[[capabilities.scenarios]]
name = "million-inhabitants"
when = "the world is configured with 1,000,000 ambient inhabitants"
then = "the simulation runs at 60 Hz with ambient state stored in kilobytes and no per-inhabitant entities"
[[capabilities.scenarios]]
name = "materialise-on-approach"
when = "the player moves within the materialisation radius of an ambient cell"
then = "individual NPC entities appear in that cell within the documented latency"
[[capabilities.scenarios]]
name = "mass-conservation"
when = "1,000 materialisation and dematerialisation cycles run on the same cells"
then = "total population mass differs from the start by less than the documented tolerance"
[[capabilities.scenarios]]
name = "entity-budget-shortfall"
when = "materialisation would exceed the configured entity budget"
then = "a subset is materialised and a `MaterialisationShortfall` event reports the omitted count"

[[capabilities]]
name        = "headless-parity"
title       = "Headless and Rendered Parity"
description = "The same simulation runs on a server with no GPU and in a rendered client, producing identical results."
requirements = [
    "MUST compile with `--no-default-features` against bevy_app, bevy_ecs and bevy_math only.",
    "MUST not read window, input, camera or asset state from simulation code; rendering observes simulation, never drives it.",
    "MUST produce identical simulation digests with and without rendering features enabled.",
    "MUST keep the wasm32-unknown-unknown target compiling for both the headless and rendered feature sets.",
]
[[capabilities.scenarios]]
name = "headless-digest"
when = "the same seed and commands run headless and in a rendered app for 500 ticks"
then = "both report the same digest"
[[capabilities.scenarios]]
name = "no-render-in-sim"
when = "the simulation module is compiled with no rendering features"
then = "it builds with no references to sprite, mesh, camera or window types"

[[capabilities]]
name        = "api-ergonomics"
title       = "Five-Line Ergonomics"
description = "A new user gets a working, good-looking crowd with a handful of lines and no reading."
requirements = [
    "MUST provide a prelude that imports everything needed for a first crowd in one `use`.",
    "MUST allow a working 10,000-NPC crowd in five lines or fewer, verified by a doctest that is literally five lines.",
    "MUST use newtypes over primitives at the public boundary (counts, radii, weights, ticks) so call sites cannot transpose arguments.",
    "MUST surface every configuration mistake as a typed error with a message that says what to do next.",
    "MUST keep presets for common situations (`city_ambient`, `battle_horde`, `marketplace_bustle`) so a game can start from taste rather than numbers.",
]
[[capabilities.scenarios]]
name = "five-lines"
when = "a new user copies the README quickstart into a fresh Bevy app"
then = "it compiles, runs and shows a crowd without any other configuration"
[[capabilities.scenarios]]
name = "typo-guard"
when = "a user passes a tick count where a radius is expected"
then = "it fails to compile because both are distinct newtypes"
[[capabilities.scenarios]]
name = "actionable-error"
when = "a user configures a 0-sized population"
then = "the error message names the field, the invalid value and the valid range"

[[capabilities]]
name        = "state-persistence"
title       = "Snapshots, Replay and Save"
description = "Simulation state can be captured, restored, replayed and compared, which is also how determinism is proven."
requirements = [
    "MUST serialise the full simulation state — tick, seed, population, per-NPC brains, needs, facts and ambient field — into a versioned snapshot.",
    "MUST reject snapshots from a future or unknown schema version with a typed error rather than a partial load.",
    "MUST restore a snapshot and continue simulation with results identical to the uninterrupted run.",
    "MUST record a command log of external inputs so a run can be replayed from seed plus log.",
]
[[capabilities.scenarios]]
name = "snapshot-round-trip"
when = "a snapshot is taken at tick 500, restored into a fresh world, and both run to tick 1,000"
then = "both worlds report the same digest at tick 1,000"
[[capabilities.scenarios]]
name = "version-reject"
when = "a snapshot declaring schema version 99 is loaded"
then = "a typed `UnsupportedSnapshotVersion` error is returned and the world is untouched"
[[capabilities.scenarios]]
name = "replay-from-log"
when = "a 2,000-tick run is replayed from its seed and command log"
then = "the final digest matches the original run"

[[capabilities]]
name        = "observability"
title       = "Observability for Humans"
description = "A developer can see what the crowd is thinking, where the budget went, and why an NPC did something."
requirements = [
    "MUST expose a stats snapshot resource with entity counts per tier, nodes visited, behaviours selected and time spent per phase.",
    "MUST provide gizmo debug drawing for tiers, spatial grid cells, flow fields and steering vectors, off by default.",
    "MUST trace every cognition decision at debug level with the NPC identifier, chosen behaviour and the utility scores that produced it.",
    "MUST provide a single-command textual report a developer can paste into an issue.",
]
[[capabilities.scenarios]]
name = "stats-snapshot"
when = "the simulation has run 100 ticks"
then = "the stats resource reports counts per tier that sum to the live population"
[[capabilities.scenarios]]
name = "explain-decision"
when = "a developer asks why an NPC chose a behaviour"
then = "a trace record lists every candidate, its score and the winning reason"

# ─── Phase 1: Foundations ────────────────────────────────────────────────────

[[capabilities]]
name        = "social-memory"
title       = "Social Memory"
description = "NPCs remember the subjects they have met — the player, a party, each other — cheaply enough that the remembering is a property of who is nearby rather than of how many NPCs exist."
requirements = [
    "MUST store memory in a bounded, pre-allocated structure sized by the number of *eligible* NPCs and subjects, never by the population, and MUST reject enrolment past capacity with a typed result instead of allocating.",
    "MUST keep a memory slot at a fixed, asserted size so the store's cost is `capacity × subjects × slot` and cannot drift silently.",
    "MUST treat any subject uniformly: a player, a party member, a pet or another NPC are the same kind of thing to the store.",
    "MUST decay memory deterministically from `now - last_seen` at read time, with no per-tick pass over stored memories and no floating-point arithmetic anywhere in the decay path.",
    "MUST reach zero: a faded memory reads as absent, never as a permanent sliver of hostility or affection.",
    "MUST offer a cold tier that keeps a record for an NPC that left the eligible set, with a bounded capacity and an eviction rule that is a pure function of stored values.",
    "MUST expose retention as a caller decision — forget on release, park in the cold tier, or serialise into a save — and MUST NOT choose one on the game's behalf.",
    "MUST be feature-gated and add no dependency when enabled.",
    "MUST document that memory keyed to a recycled slot identity is a hazard, and require unique identity or a generation counter for remembered NPCs.",
]
[[capabilities.scenarios]]
name = "first-meeting"
when = "an eligible NPC records an encounter with a subject it has never met"
then = "recall returns a slot with one encounter, a non-zero familiarity and valence matching the encounter kind"
[[capabilities.scenarios]]
name = "grudge-forms"
when = "a subject that was helped then attacks the same NPC"
then = "the NPC's valence for that subject turns negative and `is_grudge` reports true, without the earlier kindness being erased outright"
[[capabilities.scenarios]]
name = "forgetting"
when = "a memory is read after its decay half-life has elapsed many times over"
then = "the read reports no memory at all rather than a residual value"
[[capabilities.scenarios]]
name = "eligibility-bounded"
when = "an eleventh-thousandth NPC is enrolled into a store built for ten thousand"
then = "enrolment fails with a typed result, the store's allocation is unchanged, and no other NPC's memory is disturbed"
[[capabilities.scenarios]]
name = "left-behind"
when = "an NPC with a grudge leaves the eligible set and the game parks its record"
then = "the record can be restored to another store with the same valence, encounter count and flags"
[[capabilities.scenarios]]
name = "replay-parity"
when = "two stores are fed identical encounters in identical order on different machines"
then = "every recalled and decayed value agrees exactly"

