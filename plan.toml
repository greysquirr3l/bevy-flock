[[phases.tasks]]
slug      = "behavior-tree-engine"
kind      = "feature"
title     = "Behaviour trees with typed nodes and a blackboard"
goal     = "A behaviour tree that designers can read, programmers can extend, and the scheduler can interrupt — compiled to a flat node array so evaluation allocates nothing."
depends_on = ["domain-vocabulary"]
implements = ["pluggable-logic", "deterministic-simulation"]
hints = [
    "Nodes: `Sequence`, `Selector`, `Parallel { policy }`, `Inverter`, `Cooldown`, `Timeout`, `Condition`, `Action`, plus `RepeatUntilFail`. Status is `Success | Failure | Running` with explicit running-state semantics for sequences (resume at the same child).",
    "Compile the authored tree into a flat `Vec<Node>` with child ranges, so evaluation walks indices and never the heap — this is the performance story for 100,000 NPCs and must be measured.",
    "Blackboard is a typed, fixed-capacity key-value store keyed by `BlackboardKey` consts, not strings; values are a small enum (`Bool`, `Int`, `Float`, `EntityRef`, `Vec3`).",
    "Builder API mirrors the tree shape (`seq([...])`, `sel([...])`, `act(Greet)`) so trees read like the thing they describe; a RON loader behind the `serde` feature produces the same structure.",
    "Interruption: `abort()` must be propagated depth-first and every running node must be given a chance to clean up — test it, because it is the classic source of stuck NPCs.",
    "Deterministic tie-breaking in `Selector`: order of children, never a scored pick (utility scoring is a separate task).",
    "Document the node semantics table in the module docs: tick, resume, abort, reset for each node type.",
]
test_hints = [
    "Semantics table test: one test per node type per status outcome, including the resume-after-running case.",
    "Abort test: a running sequence aborted mid-child leaves no node in `Running` and releases its blackboard writes.",
    "Allocation test: evaluating a 1,000-node tree 10,000 times allocates zero bytes after warm-up.",
    "Golden test: a RON-authored tree and the equivalent builder tree produce identical evaluation traces.",
    "Fuzz test: random tree shapes never panic and always terminate.",
]
must_haves = [
    "Flat node storage, no per-evaluation allocation.",
    "Abort semantics tested, not assumed.",
    "RON round-trip equal to builder-built trees.",
]
evaluation_criteria = [
    "Evaluation of a 20-node tree costs under the documented nanosecond budget per NPC.",
    "No `Box<dyn Node>` in the hot path — dyn dispatch only at leaf boundaries, and that decision is documented.",
]

[[phases.tasks]]
slug      = "utility-scoring"
