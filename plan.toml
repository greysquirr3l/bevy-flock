    "`hello_flock`: 10 NPCs, five lines of setup, 2D, no assets required — the do-not-make-me-read example.",
    "`city_crowd`: 3D, 10,000 NPCs, instanced, with an on-screen HUD showing tier counts, frame time and budget usage.",
    "`horde_100k`: headless, prints a per-second throughput table and a digest — the benchmark-as-a-demo.",
    "`tavern_dialog`: dialogue graph with facts, barks, and a printed transcript; no rendering needed.",
    "`custom_behavior`: a game-defined leaf behaviour, a game-defined director, and a full-takeover brain, side by side.",
    "`ambient_metropolis`: 1,000,000 ambient inhabitants, a camera you can move to watch materialisation happen, with a HUD showing ambient mass vs materialised entities.",
    "Each example gets a README section with a screenshot or GIF and the exact command to run it; each is built in CI so it cannot rot.",
]
test_hints = [
    "All six examples build in CI with their required features.",
    "The two headless examples run for a fixed number of ticks in CI and assert their digest, so an example cannot silently break.",
    "Each rendered example is smoke-tested with a headless run of its simulation half.",
]
must_haves = [
    "Six examples, all building in CI.",
    "Each demonstrates exactly one promise from the pitch.",
    "Screenshots or GIFs committed for the rendered ones.",
]
evaluation_criteria = [
    "`cargo run --example hello_flock` works on a fresh clone with default features.",
    "The 3D example shows the documented frame time on the demo machine.",
]

# ─── Phase 9: Ship ──────────────────────────────────────────────────────────

[[phases]]
name  = "Ship"
order = 9

[[phases.tasks]]
slug      = "docs-site-and-readme"
kind      = "feature"
title     = "README that convinces, book that teaches, comparison that holds up"
goal     = "The front door: a README that states the promise and proves it, and a book that makes the promise usable."
depends_on = ["prelude-rustdoc-book", "examples-showcase"]
implements = ["api-ergonomics", "observability"]
hints = [
    "README: badges, one-paragraph pitch, animated GIF of the 10,000-NPC demo, five-line quickstart, a capability table, a benchmark table with the machine named, a comparison table against big-brain (utility AI, Bevy 0.15 as of late 2026) and bevy_boids, and an honest 'what this is not' section.",
    "Every claim in the README links to the test, benchmark or example that proves it. No unlinked adjectives.",
    "Publish the book to GitHub Pages from CI, versioned per release.",
    "`docs/comparison.md` with what each alternative does better — credibility comes from not pretending otherwise.",
    "A three-minute 'from zero to crowd' walkthrough in the README, verified verbatim on a fresh clone.",
]
test_hints = [
    "Link check on README and book passes in CI.",
    "The quickstart is executed verbatim in CI (`cargo test --doc` plus a script that copies it into a temp crate).",
    "Benchmark table numbers equal the committed artifacts.",
]
must_haves = [
    "README with proof links for every claim.",
    "Book published from CI.",
    "Comparison table with the alternatives named.",
]
evaluation_criteria = [
    "A sceptical reader can verify every number in the README in under ten minutes.",
    "The fresh-clone walkthrough works exactly as written.",
]

[[phases.tasks]]
slug      = "release-and-community"
kind      = "infrastructure"
title     = "First release: versioning, publishing and contribution path"
goal     = "Ship 0.1.0 to crates.io with a changelog, a contribution path and a release process that is boring on purpose."
depends_on = ["docs-site-and-readme", "benchmark-suite"]
implements = ["api-ergonomics"]
hints = [
    "`cargo-release` or a release workflow: version bump, changelog from conventional commits (git-cliff), tag, `cargo publish --dry-run`, publish, GitHub release with the changelog extracted.",
    "`CHANGELOG.md` shows the 0.1.0 feature list grouped by phase, written for humans.",
    "`CONTRIBUTING.md`: how to run preflight, how to add a behaviour, how to add a benchmark, the ADR requirement for design changes, and the review checklist.",
    "Issue templates for bug (with `flock_report()` output required), feature request, and performance regression (with benchmark id).",
    "Publish checklist as a script (`xtask release-check`) that verifies: clean tree, green CI, changelog entry, version consistency, `cargo package` contents, semver-checks pass.",
    "`docs/roadmap.md` stating what comes after 0.1.0 (scripting bridge, GPU crowd fields, navmesh baking) so the 0.1.0 boundary is legible.",
]
test_hints = [
    "`cargo package --list` contains only intended files and `cargo publish --dry-run` succeeds.",
    "Release check script fails on a dirty tree and on a version mismatch (verified).",
    "Changelog generation produces a non-empty entry for the release.",
]
must_haves = [
    "0.1.0 published (or publish-dry-run green with the user's token absent).",
    "Changelog, contributing guide and issue templates present.",
    "One-command release check.",
]
evaluation_criteria = [
    "A stranger can clone, run preflight, and open a correct PR using CONTRIBUTING.md alone.",
    "`cargo semver-checks` passes against the published 0.1.0 baseline.",
]

[[phases.tasks]]
slug      = "perf-audit"
kind      = "audit"
title     = "Independent performance audit against the stated envelope"
goal     = "Verify the performance claims from a cold start, with no access to the implementer's assumptions, and fix what does not hold."
depends_on = ["benchmark-suite"]
implements = ["cognition-budget", "crowd-motion", "ambient-tier"]
hints = [
    "Re-run every documented benchmark on a clean machine profile (release build, no `target/` cache, tracing off) and compare against `docs/performance.md`.",
    "Profile the three slowest paths with `samply`/`perf` and attach the flamegraph summary to the findings; name the top three costs and whether they are inherent or accidental.",
    "Check for hidden allocations with a counting allocator in a 10,000-tick run; any steady-state allocation is a defect.",
    "Verify the frame-budget claims under adversarial conditions: all NPCs near tier, all stale, all in one cell, all requesting a bark on the same tick.",
    "Produce `docs/audits/performance-YYYY-MM.md` with methodology, numbers, regressions found, and the fixes applied (code, not recommendations).",
]
test_hints = [
    "Every regression found gets a fix and a regression test or benchmark gate.",
    "The adversarial scenarios are added to the benchmark suite permanently.",
]
must_haves = [
    "Audit document with measured numbers.",
    "Every claim either confirmed with evidence or corrected in the docs.",
    "Adversarial benchmarks added.",
]
evaluation_criteria = [
    "No documented performance number is unverified or stale.",
    "The worst-case cell-density scenario is measured and bounded.",
]

[[phases.tasks]]
slug      = "cross-platform-audit"
kind      = "audit"
title     = "Cross-platform, wasm and feature-matrix audit"
goal     = "Prove the crate builds and behaves everywhere it claims, and that the feature matrix is orthogonal rather than nominally present."
depends_on = ["ci-and-supply-chain", "examples-showcase"]
implements = ["headless-parity", "deterministic-simulation"]
hints = [
    "Build matrix: default, `--no-default-features`, each feature alone, each pair that the docs claim composes, `--all-features`, and wasm32 for the headless and 2D sets.",
    "Run the determinism suite on all three desktop platforms plus wasm (wasm via a headless browser runner if practical; otherwise document the gap explicitly rather than claiming coverage).",
    "Check MSRV actually builds: a CI job with the pinned toolchain and `-Zminimal-versions` style dependency resolution where practical.",
    "Audit for accidental platform assumptions: path separators, `Instant`, file system access, thread counts, endianness assumptions in any byte-level code.",
    "Produce `docs/audits/platform-YYYY-MM.md` with the matrix as a table and the gaps named.",
]
test_hints = [
    "Every cell of the documented matrix is a CI job or explicitly documented as not covered.",
    "wasm build of the headless feature set is green.",
    "MSRV job is green.",
]
must_haves = [
    "Feature matrix table in the docs matches CI exactly.",
    "Gaps named rather than hidden.",
]
evaluation_criteria = [
    "No feature combination in the docs fails to compile.",
    "No platform-specific code outside a `cfg`-guarded adapter.",
]

# ─── Policy ──────────────────────────────────────────────────────────────────

[security]
# The crate has no network, storage or authentication surface. Hardening is
# covered by the supply-chain job (cargo-deny/audit) and the fuzz targets,
# so the generic web-surface hardening task would be noise here.
skip_hardening_task = true

[integration]
skip_wiring_audit = false
skip_stub_audit   = false

[targets]
vscode      = true
claude      = true
agent_rules = true
opencode    = false

[style]
avoid_ai_patterns = true
avoid_god_files   = true
strict            = true
completion_standard = """
Every task ships only when all of the following hold, and the evidence is in
the completion notes rather than in a claim:

- Preflight (build + test + lint + deny) passes with zero warnings, on the
  default feature set, on --all-features and on --no-default-features.
- Every exit criterion in the task file is met, including the ones that were
  inconvenient. A partially met criterion is a failed task.
- The task's benchmark or measurement exists and was actually run. Numbers are
  pasted, not estimated, and the machine is named.
- No placeholder survives: no todo!(), no unimplemented!(), no function
  returning a hard-coded value as a stand-in, no "for now" branch. If a real
  implementation is possible, it is done in this task.
- No #[allow] was added. No .unwrap()/.expect() entered library code. No
  unsafe entered the crate. If a lint had to be silenced, the reason is in the
  commit message and an ADR exists.
- New public API has a compiled doctest, and the item is listed in the API
  snapshot diff.
- Documentation describes the decision, not the syntax: module docs answer
  "why is it built this way" and "what breaks if I change it".
- The relevant ADR and ARCHITECTURE.md section are updated in the same task as
  the code, not afterwards.
- Tests fail if the implementation is reverted to a stub. Verified by
  commenting out the implementation and watching the test go red.
- The work is finished, not deferred. "Follow-up task" is only acceptable for
  genuinely new scope the plan did not name, never for finishing this one.
"""
