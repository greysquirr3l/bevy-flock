evidence = """`demo/src/bin/ashfall-play.rs` flies the same seeded city the PNGs show without a window, a GPU or a widget toolkit. `session.rs` is a pure core — camera, view, lens, draw budget — with eleven unit tests, so the interactive path is testable in CI; `input.rs` decodes keys with a 140 ms escape timeout and twelve tests; `terminal.rs` enters raw mode through `stty`, paints one cell per two pixels with `▀`, and restores on `Drop` and on `SIGINT`; `playback.rs` runs the same flight headlessly and writes a PNG per frame plus `playback.json`, which is what CI holds down.

Making it steerable was a rendering decision, not a simulation one: `session::Budget` changes the shot rather than the world (420 bodies inside 240 m, ruins inside 300 m, triangles under 0.75 px dropped) and past 24 m a body is a two-triangle camera-facing billboard tinted with the asset's own material instead of an 11,000-triangle mesh. `impostor_distance` defaults to infinity, so the five shipped PNGs are byte-identical after the change — re-rendering them left `docs/demo/` untouched.

Measured: 850 ms a frame at full detail (600x375), 19.0 ms under the budget (112x72), and 38 ms in a real 112x88-pixel pty, which is 26 fps over a run of frames. The pty run is how the front end was verified at all: `script -qec` drives it, a byte decoder turns the captured escapes back into an image, and that image is `docs/demo/ashfall-play.png`.

`demo/benches/render_pipeline.rs` puts the same 2,000-body scene through both pipelines: the software rasteriser, and a real `wgpu` device on its `noop` backend (adapter, pipeline, vertex and index buffers, instance upload, render pass, submission — commands discarded). The CPU half of a wgpu frame is 33.6 us for 2,064 instances and is indifferent to the target size; the software path is 850 ms and 19.0 ms. The ADR is explicit that this is not a GPU benchmark and that the ratio is the shape of the cost, not a verdict.

`bevy-archie` is not wired in and the ADR says why: `winit` needs a display server, and this environment has none, nor `libvulkan`, nor `libxkbcommon`. The seam a windowed front end needs — `Session`, `Session::advance(&CameraInput, dt)`, `Command`, `Budget` — is public and tested, so the binding is one file on a machine with a display. CI gained two steps: a headless playback whose ten frames and table are checked, and a compile of the benchmark so the wgpu comparison does not rot."""

[[completed]]
slug = "ashfall-demo-cross-fade"
title = "Cross-fade the impostor switch by pixel coverage, and cost it"
phase = "Reach"
delivered_in = "HEAD"
evidence = """`Shot::impostor_band` turns the level-of-detail switch into a window and `render3d` draws a body inside it twice: the quad at an increasing coverage, the mesh at the coverage it gives up. The fade is an 8 by 8 ordered dither resolved per pixel by `Renderer::triangle_coverage`, not a blend, and the reason is a defect found while building it: compositing a faded mesh turns its depth write off, so the body stops occluding itself and a hidden facet overpaints a visible one. Coverage keeps every fragment opaque, so a fading body still writes depth and still hides its own back faces; the cost is a hole or two at the dissolve's silhouette, which is why the five committed views hold the band at zero and only the steered front end sets it. The blending path was removed rather than left as an option — `Image::submit`, `Image::blend` and the `alpha` parameters are gone, so there is one fade and it is the correct one.
Five tests pin the behaviour: a band of zero is byte-for-byte the hard switch; a body inside the band costs its mesh plus two triangles and a wider band adds two per body it reaches; half way through the band a quarter to three quarters of the quad's pixels have changed hands, which a hard switch cannot produce at either end; nothing outside the body's own pixels changes; and the same frame twice is the same bytes. Restoring a hard switch fails both band tests, which is how the teeth were checked.
Measured with `cargo bench --bench render_pipeline -- "software/interactive"`: 19.39 ms with an eight-metre band against 19.63 ms with the switch, inside this machine's noise floor, which is the honest claim — the band is free where it is invisible. The case for it is a 300-cell terminal, where a body is eight to ten pixels and the dissolve is the difference between a pop and a fade; no display of that size exists here, so no number is claimed for it. `docs/performance.md` records the pair, ADR 0050 records the design and its limits, and `docs/demo/billboard-optimisations.md` records the four further optimisations with the measurement that would settle each."""
