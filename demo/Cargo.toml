[package]
name = "bevy-flock-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Ashfall Verge: a technical playground for bevy-flock, with generated assets and artefact output rather than a renderer."
license = "MIT OR Apache-2.0"
# Three binaries live in this package: the flight, the headless playback and the five-view capture.
# `cargo run` has to be told which one it means, and the command in `demo/README.md` — and the one the
# demo's CI job runs — is the plain one, so the flight is what a plain `cargo run` runs.
default-run = "bevy-flock-demo"

# A package rather than a workspace member, for the same reason `compat/` is: a demo should not be
# able to break the library's build, and the library should not pay for the demo's dependencies.
[workspace]

[dependencies]
# `ecs` is the dependency edge to `bevy-flock-ecs`, which carries the plugin, the components and the
# systems this demo drives. The facade turns it off by default so a headless simulation can depend on
# the core alone, so a demo that runs a crowd in an `App` has to ask for it.
bevy-flock = { path = "..", default-features = false, features = ["simd", "threads", "ecs"] }
bevy_app = "0.20.1"
bevy_ecs = "0.20.1"
bevy_math = "0.20.1"
bevy_transform = "0.20.1"
# A headless `App` has no clock, and an integrator with a zero delta integrates nothing: the
# crowd stood perfectly still until this was added. The library does not add it because a server
# may already own its own time source.
bevy_time = "0.20.1"

[dev-dependencies]
bevy_flock = { package = "bevy-flock", path = "..", default-features = false, features = ["simd", "threads", "ecs"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# The comparison in `benches/render_pipeline.rs` needs a second renderer's CPU cost, and wgpu's
# `noop` backend is the only one that runs without a GPU, a driver or a display: it validates and
# encodes exactly as the real backends do and throws the commands away. Dev-dependency, so the demo
# itself still builds with no graphics stack at all.
wgpu = { version = "30", default-features = false, features = ["noop", "std", "wgsl"] }
futures-lite = "2"
bytemuck = { version = "1", features = ["derive"] }

[[bench]]
name = "render_pipeline"
harness = false

# Where the per-frame cost of reading the crowd out of the ECS goes, and how much of it is the sort.
[[bench]]
name = "crowd_readback"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
# `raw_borrows_via_references` belongs here and cannot be: creating a real reference and casting it
# away asserts aliasing the caller never promised, and `&raw const place` does not. The lint exists
# in rustc 1.99, and naming a lint the pinned 1.97 toolchain does not know turns every downstream
# build into an `unknown_lints` warning — which is why it is enabled by the probe-gated
# `lint-future` CI job instead, alongside the two clippy 1.99 lints.
# `rust_2018_idioms` is deliberately off: it flags every `Res<T>`, `Query<...>`
# and `Commands` in a Bevy system as a hidden lifetime, which is the framework's
# idiomatic spelling and not something this crate should paper over.
[lints.clippy]
# --- The spine -------------------------------------------------------------------------------
# Groups first, at the lowest priority, so individual lints below can move either way.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Allowed: opted out of, because they fight the domain vocabulary or duplicate documentation that
# is enforced elsewhere.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
# Denied: every one of these is a production incident waiting to happen, tests included. The code
# satisfies them by construction rather than by `#[allow]`: fallible constructors are `Result`,
# test fixtures use `testkit::OrDie` (which reports the failure with `unreachable!`, not `panic!`),
# and the kernels address slices through the index helpers in `application::crowd`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
# `panic` covers `panic!` and nothing else. `todo!()` and `unimplemented!()` are restriction lints
# that no group turns on, so without these two a function nobody finished would pass every gate
# above. `unreachable!()` is deliberately not denied: it is the failure primitive in
# `testkit::OrDie` and the way a `match` says "the other arm cannot happen", which is a claim about
# the code rather than a promise to come back to it.
todo = "deny"
unimplemented = "deny"
# --- Denied here too, at last ----------------------------------------------------------------
# This crate used to allow eight of these, which made the largest body of code in the tree the one
# held to the loosest standard: a cast that `src/` forbids was ordinary here, and a float compared
# with `==` was ordinary here. It denies them now, and the code satisfies them rather than being
# excused from them.
#
# Bevy hands systems their parameters by value (`Res<T>`, `Query<..>`): the signature is the
# framework's, not an inefficiency to fix, and taking them by reference does not compile. The one
# system that trips this carries a documented `#[expect]`, which the audit accepts only when the
# signature really is a system's.
needless_pass_by_value = "deny"
# Every conversion the four cast lints can see goes through `bevy_flock::domain::num`, which owns
# the cast and states what it does with the bits: saturating, truncating, or exact. What remains is
# widening that `From` cannot express -- `u32 as usize`, `usize as u64` -- which is lossless on every
# target this crate supports and which none of the four lints flags. The demo is not cast-free; it is
# free of the casts that lose information silently.
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Fusing a multiply-add changes rounding. The simulation's formulas are pinned by tests that compare
# exact bits, so each site opts in deliberately rather than by suggestion.
suboptimal_flops = "allow"
# Exact float comparison is the *point* of the determinism tests: they assert bit-identical output
# across runs and across the scalar/wide/threaded roads. They say so by comparing `to_bits()`, which
# is an integer comparison of the same bits, rather than an epsilon that would hide a drift.
float_cmp = "deny"
# Criterion's `BenchmarkGroup` is a guard by design: it owns the benchmark it measures and is
# consumed by `finish()`. Each benchmark group lives in its own function, so the group's scope is
# the measurement and there is nothing to tighten.
significant_drop_tightening = "deny"
# `const` is added where it enables a static or a `const` caller, not for its own sake; the
# scheduler and config types already are, and the constructors the lint names are now too.
missing_const_for_fn = "deny"
# Benchmarks run on the settings a game actually ships with: default release,
# no LTO. Flattering the numbers with `lto = "fat"` would measure a build nobody
# uses. Debug symbols stay on so a profile can be read against the source.
# Release-shaped, with symbols. `cargo flamegraph --profile profiling` then produces a
# flamegraph whose frames are readable rather than a wall of unresolved addresses.
